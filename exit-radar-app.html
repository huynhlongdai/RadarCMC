<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit Radar — Kiểm tra token DEX trước khi mua</title>
<meta name="description" content="Chấm điểm rủi ro cấu trúc và dòng tiền ví lớn của token DEX, dựng trên dữ liệu CoinMarketCap.">
<style>
/* ==========================================================================
   EXIT RADAR — design tokens
   Đổi theme chỉ bằng khối [data-theme]. Không component nào hardcode màu.
   ========================================================================== */
:root{
  /* bề mặt */
  --bg:#17181B; --surface:#1D1F24; --surface-2:#24262C; --surface-3:#2C2F36;
  --border:#2E3138; --border-strong:#41454E;
  /* chữ */
  --text:#FFFFFF; --muted:#A6B0C3; --faint:#858CA2;
  /* mức rủi ro — CMC green-500 / orange-500 / cam đậm / red-500 */
  --risk-low:#16C784; --risk-watch:#EE8B2A; --risk-high:#E4572E; --risk-critical:#EA3943;
  /* nhấn — chỉ một màu */
  --accent:#3861FB; --accent-2:#486DF7; --accent-ink:#FFFFFF;
  --accent-soft:rgba(56,97,251,.14); --accent-line:rgba(56,97,251,.42);
  /* trạng thái */
  --ok:#16C784; --warn:#EE8B2A; --err:#EA3943;
  --focus:#486DF7;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -18px rgba(0,0,0,.75);
  --sk-base:#24262C; --sk-hi:#33363E;
  /* thang 4px */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-full:999px;
  /* chữ */
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --t-xs:12px; --t-sm:13px; --t-base:15px; --t-md:17px;
  --t-lg:20px; --t-xl:26px; --t-2xl:34px; --t-3xl:44px;
  --nav-h:57px;
}
[data-theme="light"]{
  --bg:#FFFFFF; --surface:#F8FAFD; --surface-2:#EFF2F5; --surface-3:#E1E6ED;
  --border:#DCE1EA; --border-strong:#C7CDD8;
  --text:#17181B; --muted:#616E85; --faint:#858CA2;
  --risk-low:#0B8A5D; --risk-watch:#B4660F; --risk-high:#BE4A18; --risk-critical:#C4292F;
  --accent:#2A4FD0; --accent-2:#3861FB; --accent-ink:#FFFFFF;
  --accent-soft:rgba(42,79,208,.09); --accent-line:rgba(42,79,208,.4);
  --ok:#0B8A5D; --warn:#B4660F; --err:#C4292F;
  --focus:#3861FB;
  --shadow:0 1px 2px rgba(20,24,31,.07), 0 14px 30px -18px rgba(20,24,31,.35);
  --sk-base:#E7EBF1; --sk-hi:#F2F5F9;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:var(--t-base); line-height:1.55;
  font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4,h5,p{margin:0}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--space-5)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skiplink{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--accent-ink);
  padding:10px 16px;z-index:99;border-radius:0 0 var(--radius-sm) 0}
.skiplink:focus{left:0}

/* ==========================================================================
   THANH ĐIỀU HƯỚNG
   ========================================================================== */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--border)}
.topbar .wrap{display:flex;align-items:center;gap:var(--space-5);height:var(--nav-h)}
.brand{font-family:var(--mono);font-size:var(--t-sm);letter-spacing:.14em;font-weight:700;
  color:var(--text);display:flex;align-items:center;gap:8px;flex:none}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.nav{display:flex;gap:var(--space-5);align-items:center}
.nav a{color:var(--muted);font-size:var(--t-sm);padding:4px 0;position:relative;white-space:nowrap}
.nav a:hover{color:var(--text)}
.nav a.on{color:var(--text)}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent)}
.topright{margin-left:auto;display:flex;align-items:center;gap:var(--space-2);flex:none}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;background:transparent;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--accent-2)}
.bottombar{display:none}
@media (max-width:639px){
  .nav{display:none}
  .topbar .wrap{height:52px}
  .bottombar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;
    z-index:45;background:var(--surface);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom)}
  .bottombar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:56px;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
  .bottombar a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
  .bottombar a.on{color:var(--accent)}
  body{padding-bottom:64px}
}

/* ==========================================================================
   NÚT
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:40px;padding:9px 16px;background:var(--surface-2);color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  font-size:var(--t-sm);font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .12s ease,border-color .12s ease,transform .06s ease}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{border-color:var(--err);color:var(--err);background:transparent}
.btn.danger:hover{background:color-mix(in srgb,var(--err) 12%,transparent)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:var(--t-xs)}
.btn.lg{min-height:46px;padding:12px 22px;font-size:var(--t-base)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn .spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ==========================================================================
   Ô NHẬP
   ========================================================================== */
.input{width:100%;min-height:44px;padding:10px 13px;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  color:var(--text);font-family:var(--mono);font-size:var(--t-sm)}
.input::placeholder{color:var(--faint);font-family:var(--sans)}
.input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--accent-2)}
.input[aria-invalid="true"]{border-color:var(--err)}
select.input{font-family:var(--sans);cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.field-help{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px}
.field-err{font-family:var(--mono);font-size:11.5px;color:var(--err);margin-top:6px;
  display:flex;gap:6px;align-items:flex-start}

/* ==========================================================================
   BADGE
   ========================================================================== */
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.04em;padding:3px 9px;border-radius:var(--radius-full);
  border:1px solid var(--border-strong);color:var(--muted);white-space:nowrap}
.badge.full{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.badge.off{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.badge.low{color:var(--risk-low);border-color:color-mix(in srgb,var(--risk-low) 50%,transparent)}
.badge.watch{color:var(--risk-watch);border-color:color-mix(in srgb,var(--risk-watch) 50%,transparent)}
.badge.high{color:var(--risk-high);border-color:color-mix(in srgb,var(--risk-high) 50%,transparent)}
.badge.crit{color:var(--risk-critical);border-color:color-mix(in srgb,var(--risk-critical) 50%,transparent)}

/* ==========================================================================
   THẺ
   ========================================================================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
.card.pad{padding:var(--space-5)}
.card-h{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:var(--space-3);font-weight:600}
.page-h{display:flex;align-items:flex-start;gap:var(--space-4);flex-wrap:wrap;
  padding:var(--space-6) 0 var(--space-5)}
.page-h h1{font-size:var(--t-xl);font-weight:650;letter-spacing:-.02em}
.page-h .sub{color:var(--muted);font-size:var(--t-sm);margin-top:var(--space-1)}
.page-h .right{margin-left:auto;display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.crumb{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;
  color:var(--faint);margin-bottom:var(--space-2)}
.crumb a{color:var(--faint)}
.crumb a:hover{color:var(--accent)}

/* dòng thông tin có đường dẫn chấm — thiết bị chữ ký */
.led{padding:var(--space-3) 0}
.row{display:flex;align-items:baseline;gap:var(--space-3);font-size:var(--t-sm);padding:7px 0}
.row .lead{flex:1;border-bottom:1px dotted var(--border-strong);transform:translateY(-3px);min-width:12px}
.row .v{font-family:var(--mono);white-space:nowrap;color:var(--text)}
.row .k{color:var(--muted)}
.row .v.pos{color:var(--warn)}
.row .v.neg{color:var(--ok)}

/* ==========================================================================
   THẺ KẾT LUẬN — 4 mức
   ========================================================================== */
.verdict{border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  background:var(--surface);overflow:hidden;position:relative}
.verdict::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vc,var(--muted))}
.verdict.low{--vc:var(--risk-low)} .verdict.watch{--vc:var(--risk-watch)}
.verdict.high{--vc:var(--risk-high)} .verdict.crit{--vc:var(--risk-critical)}
.verdict.none{--vc:var(--faint)}
.v-top{display:flex;align-items:center;gap:var(--space-5);padding:var(--space-5) var(--space-5) var(--space-4);
  border-bottom:1px solid var(--border)}
.v-score{font-family:var(--mono);font-size:var(--t-3xl);line-height:1;font-weight:700;letter-spacing:-.03em}
.v-lvl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;margin-bottom:6px}
.v-lvl.low{color:var(--risk-low)} .v-lvl.watch{color:var(--risk-watch)}
.v-lvl.high{color:var(--risk-high)} .v-lvl.crit{color:var(--risk-critical)}
.v-lvl.none{color:var(--muted)}
.v-cov{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted)}
.v-cov b{color:var(--text);font-weight:600}
.track{height:5px;background:var(--surface-3);border-radius:var(--radius-full);
  margin-top:6px;overflow:hidden;width:142px}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.v-reasons{padding:var(--space-2) var(--space-5) var(--space-4)}
/* --- tầng bằng chứng: bảng số liệu + biểu đồ --- */
.ev-sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.ev-sec h3{font-size:var(--t-md);font-weight:600;margin:0 0 6px;line-height:1.35}
.ev-sec p.sub{color:var(--muted);font-size:var(--t-sm);margin:0 0 12px;max-width:78ch}
.ev-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin:0 0 16px}
table.ev-table{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
table.ev-table th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.ev-table th.r,table.ev-table td.n{text-align:right}
table.ev-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
table.ev-table tr:last-child td{border-bottom:0}
table.ev-table td.n{font-variant-numeric:tabular-nums}
.addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
a.addr-link{text-decoration:none;border-bottom:1px dotted var(--border)}
a.addr-link:hover{border-bottom-style:solid}
.side-buy{color:var(--risk-low);font-weight:600}
.side-sell{color:var(--risk-high);font-weight:600}
.sharebar{display:inline-block;height:7px;width:56px;border-radius:4px;background:var(--border);position:relative;vertical-align:middle;margin-left:6px}
.sharebar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:currentColor;opacity:.55}
.chart{width:100%;height:auto;display:block;margin:0 0 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:4px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gate{border:1px dashed var(--border);border-radius:10px;padding:14px 16px;color:var(--muted);font-size:var(--t-sm);line-height:1.6}
.gate b{color:inherit}
.reason{display:flex;align-items:baseline;gap:var(--space-3);padding:9px 0;font-size:var(--t-sm)}
.reason + .reason{border-top:1px solid var(--border)}
.reason .n{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 14px}
.reason .t{color:var(--text);flex:1}
.reason .v{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted);white-space:nowrap}
.reason.neg .v{color:var(--ok)}
.reason .src{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}

/* ==========================================================================
   THANH ĐO CHIỀU
   ========================================================================== */
.meter{margin-bottom:var(--space-3)}
.meter .head{display:flex;align-items:baseline;gap:var(--space-2);font-size:var(--t-sm)}
.meter .key{font-family:var(--mono);color:var(--faint);flex:0 0 20px}
.meter .name{color:var(--muted)}
.meter .val{margin-left:auto;font-family:var(--mono);color:var(--text);white-space:nowrap}
.meter .track{width:100%;height:6px;margin-top:6px}
.meter .track i{border-radius:var(--radius-full)}
.meter.na .name,.meter.na .val{color:var(--faint)}
.meter.na .track{background:repeating-linear-gradient(135deg,var(--surface-3) 0 5px,transparent 5px 10px)}
.meter .ep{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px;display:block}

/* ==========================================================================
   KHỐI DÒNG TIỀN
   ========================================================================== */
.flow{border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--surface-2);padding:var(--space-4) var(--space-5);margin-top:var(--space-4)}
.flow .caveat{margin-top:var(--space-3);font-size:var(--t-sm);color:var(--muted)}
.flow .caveat b{font-weight:600}

/* ==========================================================================
   BẢNG
   ========================================================================== */
.tbl{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:500;padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--border);font-family:var(--mono);
  font-variant-numeric:tabular-nums;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl td.name{font-family:var(--sans);font-weight:600}
.tbl .up{color:var(--risk-high)} .tbl .down{color:var(--ok)} .tbl .flat{color:var(--faint)}
.tbl .ta-r{text-align:right}
.tbl .mini{display:block;font-size:10.5px;color:var(--faint)}
.pill{display:inline-block;margin-left:7px;font-size:9.5px;font-family:var(--mono);
  border:1px solid currentColor;border-radius:var(--radius-full);padding:1px 6px;vertical-align:1px}
.rowacts{display:flex;gap:6px;justify-content:flex-end}

/* ==========================================================================
   CHỌN TOKEN
   ========================================================================== */
.picker{display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);
  border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);
  cursor:pointer;width:100%;text-align:left;margin-bottom:var(--space-2);min-height:56px}
.picker:hover{border-color:var(--accent-2);background:var(--surface-2)}
.picker:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.picker .radio{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-strong);flex:0 0 15px}
.picker.flag{border-color:color-mix(in srgb,var(--risk-critical) 55%,transparent)}
.picker .nm{font-weight:600;font-size:var(--t-sm)}
.picker .nm .warn{margin-left:8px;font-family:var(--mono);font-size:9.5px;color:var(--risk-critical);
  border:1px solid var(--risk-critical);border-radius:var(--radius-full);padding:1px 6px}
.picker .ch{font-family:var(--mono);font-size:11px;color:var(--muted)}
.picker .stat{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  text-align:right;white-space:nowrap;line-height:1.5}

/* ==========================================================================
   HỘP THÔNG BÁO
   ========================================================================== */
.note-box{display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4);
  border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-2);
  font-size:var(--t-sm);align-items:flex-start}
.note-box .ic{flex:0 0 18px;font-family:var(--mono);font-weight:700;line-height:1.4}
.note-box.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.note-box.warn .ic{color:var(--warn)}
.note-box.err{border-color:color-mix(in srgb,var(--err) 55%,transparent)}
.note-box.err .ic{color:var(--err)}
.note-box.info{border-color:var(--accent-line);background:var(--accent-soft)}
.note-box.info .ic{color:var(--accent)}
.note-box b{font-weight:600}
.note-box .acts{margin-top:var(--space-3);display:flex;gap:var(--space-2);flex-wrap:wrap}

/* ==========================================================================
   TIẾN TRÌNH QUÉT
   ========================================================================== */
.steps{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-5)}
.step{display:flex;align-items:center;gap:var(--space-3);font-size:var(--t-sm);color:var(--faint)}
.step .mark{width:16px;flex:0 0 16px;font-family:var(--mono);text-align:center}
.step.done{color:var(--text)}
.step.done .mark{color:var(--ok)}
.step.run{color:var(--text)}
.step.run .mark{color:var(--accent)}
.step .t{font-family:var(--mono);font-size:10.5px;margin-left:auto;color:var(--faint)}

/* ==========================================================================
   RỖNG · KHUNG XƯƠNG
   ========================================================================== */
.empty{text-align:center;padding:var(--space-8) var(--space-5);border:1px dashed var(--border-strong);
  border-radius:var(--radius-md);background:var(--surface)}
.empty h3{font-size:var(--t-md);font-weight:600;margin-bottom:var(--space-2)}
.empty p{color:var(--muted);font-size:var(--t-sm);max-width:44ch;margin:0 auto var(--space-5)}
.sk{background:linear-gradient(90deg,var(--sk-base) 25%,var(--sk-hi) 37%,var(--sk-base) 63%);
  background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:var(--radius-sm);display:block}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ==========================================================================
   NHẬT KÝ ENDPOINT
   ========================================================================== */
details.logbox{border:1px solid var(--border);border-radius:var(--radius-md);

   Điểm hiển thị = tổng điểm các chiều áp dụng được, quy về thang 100.
   Độ phủ = tổng trọng số các chiều áp dụng được → luôn nói rõ đã chấm bao nhiêu.
   ========================================================================== */
const LIVE = {};
function rawOf(key){ return LIVE[key] || DEMO[key] || null; }

/* Cầu nối tới máy chủ nội bộ. Không gọi thẳng CMC được: CMC không gửi
   header CORS, đã kiểm chứng bằng thực nghiệm. */
const API = {
  base: Store.get('er.api', (location.origin && location.origin.indexOf('http') === 0)
        ? location.origin : 'http://127.0.0.1:8787'),
  state: { reachable:null, keyProvided:false, lastError:null, stats:null, health:null },
  url(p){ return String(this.base).replace(/\/$/, '') + p; },
  key(){ return Store.get('er.key', ''); },
  headers(){ const h = {'Accept':'application/json'}; const k = this.key(); if (k) h['X-CMC-Key'] = k; return h; },
  async get(p, ms){
    const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const t = setTimeout(() => { if (ctl) ctl.abort(); }, ms || 30000);
    try {
      const r = await fetch(this.url(p), { headers: this.headers(), signal: ctl ? ctl.signal : undefined });
      const j = await r.json().catch(() => null);
      this.state.reachable = true;
      return { ok: r.ok, status: r.status, json: j };
    } catch (e) {
      this.state.reachable = false;
      this.state.lastError = String((e && e.message) || e);
      return { ok:false, status:0, json:null, error:this.state.lastError };
    } finally { clearTimeout(t); }
  },
  async health(){
    const r = await this.get('/api/health', 9000);
    this.state.health = r.json || null;
    if (r.json) this.state.keyProvided = !!r.json.keyProvided;
    return r;
  },
  search(q){ return this.get('/api/search?q=' + encodeURIComponent(q), 20000).then(r => r.json); },
  scan(chain, address){
    return this.get('/api/scan?platform=' + encodeURIComponent(chain) + '&address=' + encodeURIComponent(address), 45000);
  },
  online(){ return State.mode !== 'offline'; }
};
function adopt(key, payload){
  LIVE[key] = payload;
  if (!DEMO[key]) DEMO[key] = payload;
  return payload;
}

function applyMode(key, mode){
  const raw = rawOf(key);
  if (!raw) return null;
  const allowed = MODES[mode].dims;
  const dims = {}; let rawSum = 0, maxSum = 0, scored = 0;
  DIM_ORDER.forEach(k => {
    const d = raw.dims[k];
    const ap = !!d.applicable && allowed.indexOf(k) !== -1;
    dims[k] = Object.assign({}, d, { applicable: ap });
    if (ap){ rawSum += d.score; maxSum += d.max; scored++; }
  });
  const coverage = maxSum;
  const score = maxSum ? Math.max(0, Math.round(rawSum / maxSum * 100)) : 0;
  return Object.assign({}, raw, {
    key, mode, dims, scoreRaw: rawSum, scoreMax: maxSum, coverage, scored,
    score, level: levelOf(score),
    reasons: (raw.reasons || []).filter(r => dims[r.dim] && dims[r.dim].applicable)
  });
}

/* Biểu đồ thanh khoản: dữ liệu gốc chỉ là SỰ KIỆN thay đổi, nên phải lùi từ
   mức hiện tại qua từng sự kiện. Sai số tích luỹ về quá khứ — có ghi rõ. */
function liqChart(evts, tlu){
  const ev = (evts || []).filter(e => e && e.ts && e.usd).sort((a,b) => a.ts - b.ts);
  if (ev.length < 2 || !tlu) return '';
  let cur = tlu;
  const pts = [{ t: Date.now(), v: tlu }];
  for (let i = ev.length - 1; i >= 0; i--){
    const ch = (ev[i].side === 'remove' ? -1 : 1) * Math.abs(ev[i].usd);
    cur = Math.max(0, cur - ch);
    pts.unshift({ t: ev[i].ts, v: cur });
  }
  const W = 640, H = 170, PL = 8, PR = 8, PT = 16, PB = 20;
  const vs = pts.map(p => p.v), mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs), span = (mx - mn) || 1;
  const x = i => PL + (W - PL - PR) * (i / (pts.length - 1));
  const y = v => PT + (H - PT - PB) * (1 - (v - mn) / span);
  const line = pts.map((p,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = line + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H-PB) + ' L' + PL + ' ' + (H-PB) + ' Z';
  const rm = ev.filter(e => e.side === 'remove').reduce((a,e) => a + Math.abs(e.usd), 0);
  const ad = ev.filter(e => e.side === 'add').reduce((a,e) => a + Math.abs(e.usd), 0);
  return '<div class="card pad"><div class="card-h">Thanh khoản dựng lại từ ' + ev.length +
      ' sự kiện thêm/rút · hiện tại ' + usd(tlu) + '</div>' +
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Thanh khoản dựng lại theo thời gian">' +
      '<path d="' + area + '" fill="currentColor" opacity="0.10"></path>' +
      '<path d="' + line + '" fill="none" stroke="currentColor" stroke-width="2"></path>' +
    '</svg>' +
    '<div class="legend"><span><i style="background:currentColor;opacity:.5"></i>đường dựng lại</span>' +
      '<span>+' + usd(ad) + ' thêm vào</span><span>−' + usd(rm) + ' rút ra</span>' +
      '<span>thấp nhất ' + usd(mn) + ' · cao nhất ' + usd(mx) + '</span></div>' +
    '<p class="caveat">Dữ liệu gốc là <b>sự kiện thay đổi</b>, không phải ảnh chụp thanh khoản theo thời gian. ' +
      'Đường này lùi từ mức hiện tại ' + usd(tlu) + ' qua từng sự kiện, nên càng về quá khứ càng nhiều sai số.</p></div>';
}

function flowChart(rows){
  const rs = (rows || []).filter(r => r && r.ts && r.usd);
  if (rs.length < 4) return '';
  const bk = {};
  rs.forEach(r => {
    const k = Math.floor(r.ts / 900000) * 900000;
    const b = bk[k] || (bk[k] = { buy:0, sell:0 });
    if (r.side === 'sell') b.sell += r.usd; else b.buy += r.usd;
  });
  const ks = Object.keys(bk).map(Number).sort((a,b) => a - b);
  const W = 640, H = 150, PT = 12, PB = 22;
  const mx = Math.max.apply(null, ks.map(k => Math.max(bk[k].buy, bk[k].sell))) || 1;
  const bw = (W - 16) / ks.length;
  let bars = '';
  ks.forEach((k,i) => {
    const b = bk[k], hb = (H - PT - PB) * (b.buy / mx), hs = (H - PT - PB) * (b.sell / mx), x = 8 + i * bw;
    if (hb > 0.4) bars += '<rect x="' + x.toFixed(1) + '" y="' + (H-PB-hb).toFixed(1) + '" width="' + Math.max(1, bw*0.42).toFixed(1) + '" height="' + hb.toFixed(1) + '" fill="var(--risk-low)" opacity=".85"></rect>';
    if (hs > 0.4) bars += '<rect x="' + (x + bw*0.45).toFixed(1) + '" y="' + (H-PB-hs).toFixed(1) + '" width="' + Math.max(1, bw*0.42).toFixed(1) + '" height="' + hs.toFixed(1) + '" fill="var(--risk-high)" opacity=".85"></rect>';
  });
  return '<div class="card pad"><div class="card-h">Mua/bán theo khung 15 phút · ' + rs.length + ' lệnh gần nhất</div>' +
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Khối lượng mua bán theo khung 15 phút">' +
      bars + '<line x1="0" y1="' + (H-PB) + '" x2="' + W + '" y2="' + (H-PB) + '" stroke="currentColor" opacity=".25"></line>' +
    '</svg>' +
    '<div class="legend"><span><i style="background:var(--risk-low)"></i>mua</span>' +
      '<span><i style="background:var(--risk-high)"></i>bán</span>' +
      '<span>khung lớn nhất ' + usdExact(mx) + '</span></div>' +
    '<p class="caveat">Mỗi cột là tổng giá trị USD trong một khung 15 phút. Đây là màu của <b>chiều dòng tiền</b>, ' +
      'không phải mức rủi ro — thang rủi ro bốn bậc nằm ở cột trái.</p></div>';
}

function evidenceHTML(v){
  const p = v.proof;
  const t = v.token;

      '<tr><td>' + addrHTML(x.address, x.url) + '</td>' +

      '<td class="n">' + pctHTML(x.share) + ' ' + shareBar(x.share) + '</td>' +
      '<td>' + (x.base ? esc(x.base) + ' / ' + esc(x.quote || '') : '—') + '</td>' +
      '<td class="n">' + (x.createdAt ? Math.round((Date.now() - x.createdAt) / 86400000) + ' ngày' : '—') + '</td>' +
      '<td>' + (x.primary ? 'pool chính' : '—') + '</td></tr>');
    out.push('<div class="ev-sec"><h3>' + (v.dims.A.applicable ? v.dims.A.score + '/' + v.dims.A.max + ' · ' : '') +

      '<p class="sub">' + pools.length + ' pool · tổng thanh khoản ' + usd(t.liquidityUsd) +
      '. Bấm địa chỉ để mở explorer — mỗi dòng kiểm chứng được độc lập.</p>' +
      evTable([{t:'Địa chỉ pool'},{t:'Sàn'},{t:'Thanh khoản',r:1},{t:'Tỷ trọng',r:1},{t:'Cặp'},{t:'Tạo cách đây',r:1},{t:''}], rows) +
      ((p.totals && p.totals.poolsSum) ?
        '<p class="caveat">Dữ liệu CMC cho <b>hai định nghĩa thanh khoản khác nhau</b>: <b>' +
        usd(p.totals.tluFromChange) + '</b> từ endpoint sự kiện thay đổi, và <b>' + usd(p.totals.poolsSum) +
        '</b> khi cộng ' + p.totals.poolsCount + ' pool ở bảng trên. Điểm A dùng con số thứ nhất, bảng dùng con số thứ hai — ' +
        'chênh lệch là do hai endpoint đo khác nhau, không phải lỗi tính.</p>' : '') +
      '</div>');
  }
  if (evts.length){
    const rows = evts.slice(0, 12).map(e =>
      '<tr><td class="n">' + tsShort(e.ts) + '</td>' +
      '<td class="' + (e.side === 'remove' ? 'side-sell' : 'side-buy') + '">' + (e.side === 'remove' ? 'rút ra' : 'thêm vào') + '</td>' +
      '<td class="n">' + usdExact(e.usd) + '</td>' +
      '<td>' + esc(e.pool || '—') + '</td>' +
      '<td>' + (e.rawType ? '<span class="addr">' + esc(e.rawType) + '</span>' : '—') + '</td>' +
      '<td>' + (e.tx ? addrHTML(e.tx, e.url)
        : (e.block ? '<span class="addr">khối ' + nf(e.block, 0) + '</span>' : '<span class="muted">—</span>')) + '</td></tr>');
    out.push('<div class="ev-sec"><h3>Sự kiện thêm/rút thanh khoản · ' + evts.length + ' sự kiện gần nhất</h3>' +
      '<p class="sub">Đây là căn cứ trực tiếp của điểm A. Mã giao dịch mở được trên explorer.</p>' +
      evTable([{t:'Thời điểm',r:1},{t:'Chiều'},{t:'Giá trị',r:1},{t:'Pool'},{t:'Loại'},{t:'Mã giao dịch'}], rows) +
      liqChart(evts, t.liquidityUsd) + '</div>');
  }

  /* ---------- B · top holder ---------- */
  const B = v.dims.B, be = B._ev || {};
  const ht = p.holdersTop || be.top_holders || null;
  const hm = p.holdersMeta || {};
  if (ht && ht.length){
    const rows = ht.slice(0, 10).map((h,i) =>
      '<tr><td class="n">' + (i+1) + '</td>' +
      '<td>' + addrHTML(h.wallet, h.url) + '</td>' +
      '<td class="n">' + pctHTML(h.percent) + '</td>' +
      '<td class="n">' + (h.balance === null || h.balance === undefined ? '—' : nf(h.balance, 0)) + '</td>' +
      '<td class="n">' + usdExact(h.buyUsd) + '</td>' +
      '<td class="n">' + usdExact(h.sellUsd) + '</td>' +
      '<td class="n">' + (h.realizedPnl === null || h.realizedPnl === undefined ? '—' : usdExact(h.realizedPnl)) + '</td>' +
      '<td>' + (h.fundingSource ? '<span class="addr">' + esc(String(h.fundingSource).slice(0,12)) + '</span>' : '—') + '</td>' +
      '<td>' + (h.name ? esc(h.name) + ' ' : '') + (h.tags ? esc(String(h.tags)).slice(0,22) : (h.name ? '' : '—')) + '</td></tr>');
    out.push('<div class="ev-sec"><h3>' + v.dims.B.score + '/' + v.dims.B.max +
      ' · B · Top ' + rows.length + ' holder: ví nào, bao nhiêu, đã mua bán gì</h3>' +
      '<p class="sub">Nguồn <span class="addr">dex/holders/list</span>' +
        (hm.shape ? ' · dạng tham số chạy được: ' + esc(Object.keys(hm.shape).join('+')) : '') +
        '. Mỗi ví có số dư, phần trăm tổng cung, USD đã mua/bán, lãi/lỗ đã thực hiện và nguồn cấp vốn.</p>' +
      evTable([{t:'#'},{t:'Ví'},{t:'% cung',r:1},{t:'Số dư',r:1},{t:'Đã mua',r:1},{t:'Đã bán',r:1},{t:'Lãi/lỗ',r:1},{t:'Nguồn vốn'},{t:'Nhãn'}], rows) +
      '</div>');
  } else {
    out.push('<div class="ev-sec"><h3>B · Danh sách holder top</h3>' +
      '<div class="gate"><b>Chưa lấy được bảng holder.</b> ' +
      '<span class="addr">dex/holders/list</span> là POST và bộ ẩn danh của CMC chặn nó — đã thử ' +
      ((hm.tried || []).length || 4) + ' dạng tham số, tất cả trả <span class="addr">' + (hm.status || 400) + '</span>. ' +
      'Cắm key CMC Pro là bảng này hiện đủ: địa chỉ ví, % tổng cung, số dư, USD đã mua/bán, lãi/lỗ đã thực hiện, ' +
      'nguồn cấp vốn, nhãn và 4 cờ rủi ro (blacklist · meme-pump · thanh khoản mỏng · mức rủi ro).</div>' +
      '<p class="sub" style="margin-top:10px">Số liệu đang có: ' + nf(be.holders || t.holders || 0) + ' holder' +
        (be.holders_per_mcap_m ? ' · ' + nf(be.holders_per_mcap_m, 1) + ' holder mỗi triệu USD vốn hoá' : '') +
        (be.dilution ? ' · tổng cung gấp ' + nf(be.dilution, 2) + ' lần cung lưu hành' : '') + '</p></div></div>');
  }

  /* ---------- E · ví lớn + lệnh thô ---------- */
  const w = v.whale, rows = (w && w.rows) || [];
  if (rows.length){
    const wsp = (w.wallets || []).slice(0, 10).map(d =>
      '<tr><td>' + addrHTML(d.wallet, acctURL(t.chain, d.wallet)) + '</td>' +
      '<td class="n">' + usdExact(d.buyUsd) + '</td>' +
      '<td class="n">' + usdExact(d.sellUsd) + '</td>' +
      '<td class="n">' + signed(d.buyUsd - d.sellUsd) + '</td>' +
      '<td class="n">' + d.txs + '</td>' +
      '<td>' + (d.bundle ? '<span class="warn">bundle/bot</span>' : '—') + '</td>' +
      '<td class="n">' + tsShort(d.lastTs) + '</td></tr>');
    const sw = rows.slice(0, 15).map(r =>
      '<tr><td class="n">' + tsShort(r.ts) + '</td>' +
      '<td>' + addrHTML(r.wallet, acctURL(t.chain, r.wallet)) + '</td>' +
      '<td class="' + (r.side === 'sell' ? 'side-sell' : 'side-buy') + '">' + (r.side === 'sell' ? 'bán' : 'mua') + '</td>' +
      '<td class="n">' + usdExact(r.usd) + '</td>' +
      '<td class="n">' + (r.amount === null || r.amount === undefined ? '—' : nf(r.amount, 2)) + '</td>' +
      '<td>' + esc(r.exchange || '—') + '</td>' +
      '<td>' + (r.bundle ? '<span class="warn">bundle</span>' : '—') + '</td>' +
      '<td>' + addrHTML(r.tx, txURL(t.chain, r.tx)) + '</td></tr>');
    out.push('<div class="ev-sec"><h3>' + v.dims.E.score + '/' + v.dims.E.max +
      ' · E · ' + (w.wallets || []).length + ' ví trong mẫu ' + (w.sampled || rows.length) + ' lệnh' +
      (w.windowMinutes ? ' (' + Math.round(w.windowMinutes) + ' phút gần nhất)' : '') + '</h3>' +
      '<div class="note-box warn" style="margin-bottom:12px"><span class="ic">!</span><div>' +
      '<b>Đây là mẫu, không phải tổng 24h.</b> Endpoint chỉ trả ~20 lệnh mỗi trang, hệ thống lấy ' +
      (v.window ? v.window.swapPages : 1) + ' trang. Cửa sổ thời gian thực tế của mẫu là ' +
      (w.windowMinutes ? Math.round(w.windowMinutes) + ' phút' : 'chưa xác định') +
      ' — không được đọc như số liệu cả ngày.</div></div>' +
      evTable([{t:'Ví'},{t:'Đã mua',r:1},{t:'Đã bán',r:1},{t:'Ròng',r:1},{t:'Lệnh',r:1},{t:'Dấu hiệu'},{t:'Lần cuối',r:1}], wsp) +
      '<p class="sub" style="margin-top:16px">Lệnh thô gần nhất — mỗi dòng có mã giao dịch mở được trên explorer:</p>' +
      evTable([{t:'Thời điểm',r:1},{t:'Ví'},{t:'Chiều'},{t:'Giá trị USD',r:1},{t:'Số token',r:1},{t:'Sàn'},{t:'Dấu hiệu'},{t:'Mã giao dịch'}], sw) +
      flowChart(rows) + '</div>');
  }

  if (!out.length) return '';
  return '<div class="card pad"><div class="card-h">Bằng chứng · số liệu tra được cho từng kết luận</div>' +
    '<p class="caveat" style="margin-bottom:14px">Mọi con số dưới đây đến từ dữ liệu CMC trả về trong lần quét này. ' +
    'Địa chỉ ví, pool và mã giao dịch đều mở được trên explorer để bạn tự kiểm chứng. ' +
    'Chỗ nào chưa lấy được thì nói rõ chưa lấy được, không suy diễn.</p>' +
    out.join('') + '</div>';
}

    calls.map(c => '<div class="logline"><span class="path">' + esc(c.path) + '</span>' +
      '<span class="st' + (c.status >= 400 ? ' bad' : '') + '">' + c.status + '</span>' +

}

  const key = keyOf(chain, addr);
  const v = applyMode(key, State.mode);
  if (!v) {
    return '<div class="page-h"><h1>Không có kết quả cho token này</h1></div>' +
      '<div class="empty"><h3>Chưa quét token này</h3>' +
      '<p>Liên kết bạn mở không có trong dữ liệu cục bộ. Quét lại để tạo kết quả mới.</p>' +
      '<a class="btn pri" href="#/">Quét token</a></div>';
  }
  const t = v.token;
  const inWatch = State.watch.some(w => w.key === v.key);
  const lowCoverage = v.coverage < 50;

  /* thẻ kết luận — hoặc thay hẳn khi độ phủ dưới 50% (trạng thái 5) */
  let verdictCard;
  if (lowCoverage) {
    verdictCard = '<div class="verdict none"><div class="v-top" style="align-items:flex-start">' +
      '<div><div class="v-lvl none">Không đủ dữ liệu</div>' +

      '<p style="color:var(--muted);font-size:var(--t-sm);margin-top:8px;max-width:52ch">' +
      'Chỉ chấm được ' + v.scored + '/5 chiều (' + v.coverage + '% trọng số). ' +
      'Một điểm số dựng trên từng này dữ liệu sẽ trông chắc chắn hơn thực tế, nên hệ thống không đưa ra điểm.</p></div>' +
      coverageBlock(v) + '</div>' +
      '<div class="v-reasons"><div class="row"><span class="k">Lấy được</span><span class="lead"></span>' +
      '<span class="v">' + DIM_ORDER.filter(k => v.dims[k].applicable).map(k => k + ' · ' + v.dims[k].label).join(', ') + '</span></div>' +
      '<div class="row"><span class="k">Không lấy được</span><span class="lead"></span>' +
      '<span class="v">' + (DIM_ORDER.filter(k => !v.dims[k].applicable).map(k => k + ' · ' + v.dims[k].label).join(', ') || '—') + '</span></div>' +
      '<div class="row"><span class="k">Đã thử</span><span class="lead"></span>' +
      '<span class="v">' + v.calls.length + ' lời gọi · ' + v.calls.filter(c => c.status >= 400).length + ' lỗi</span></div>' +
      '</div></div>';
  } else {
    const L = LEVELS[v.level];
    verdictCard = '<div class="verdict ' + L.cls + '"><div class="v-top">' +
      '<div><div class="v-lvl ' + L.cls + '">' + L.vn + '</div>' +
      '<div class="v-score">' + v.score + '</div></div>' +
      coverageBlock(v) + '</div>' +
      '<div class="v-reasons">' +
      (v.reasons.length
        ? v.reasons.map((r,i) => {
            const neg = r.value < 0;
            return '<div class="reason' + (neg ? ' neg' : '') + '"><span class="n">' + (i+1) + '</span>' +
              '<span class="t">' + esc(r.text) +
              '<span class="src">' + r.dim + ' · ' + esc(v.dims[r.dim].endpoint) + '</span></span>' +
              '<span class="v">' + signed(r.value) + ' / ' + r.max + '</span></div>';

      '</div></div>';
  }

        : missing.map(k => k + ' · ' + v.dims[k].label + ' (' + v.dims[k].endpoint + ')').join(' · ')) +

      (State.mode === 'public' ? '<a class="btn sm" href="#/settings">Bật chế độ đầy đủ</a>' : '') +
      '</div></div></div>');
  }
  if (State.mode === 'public') {
    notices.push('<div class="note-box info"><span class="ic">◇</span><div>' +
      '<b>Đang ở chế độ công khai.</b> Không cần key, chấm 3/5 chiều. ' +
      'Dán key CMC Pro trong Cài đặt để mở thêm chiều D và E.' +
      '<div class="acts"><a class="btn sm pri" href="#/settings">Bật chế độ đầy đủ</a></div></div></div>');
  }
  if (State.mode === 'offline') {
    notices.push('<div class="note-box warn"><span class="ic">!</span><div>' +
      '<b>Đang dùng dữ liệu mẫu.</b> Số liệu là bản chụp lúc ' + dtime(v.fetchedAt) +
      ', không phải dữ liệu sống.</div></div>');

  return '<div class="page-h">' +
      '<div><div class="crumb"><a href="#/">Quét</a><span>/</span><span>' + esc(CHAINS[t.chain] || t.chain) +

        esc(CHAINS[t.chain] || t.chain) + '</span></h1>' +
      '<div class="sub num">' + esc(t.name) + ' · ' + price(t.priceUsd) + ' · thanh khoản ' +

      '<div class="right"><span class="badge ' + MODES[State.mode].cls + '">' + MODES[State.mode].badge + '</span></div>' +
    '</div>' +
    '<div class="src-attrib"><span>Dữ liệu: CoinMarketCap API</span>' +
      '<span>' + v.calls.length + ' lời gọi</span><span>cập nhật ' + ago(v.fetchedAt) + '</span>' +
      '<span>chế độ ' + MODES[State.mode].vn.toLowerCase() + '</span></div>' +
    '<div class="cols two"><div class="stack sticky">' + verdictCard + notices.join('') + '</div>' +
      '<div class="stack">' + whaleHTML(v.whale) +
        '<div class="card pad"><div class="card-h">5 chiều chấm điểm</div>' +
          DIM_ORDER.map(k => meterHTML(k, v.dims[k])).join('') +

function chartSVG(hist){
  const W = 560, H = 190, L = 36, R = 12, T = 14, B = 30;
  const iw = W - L - R, ih = H - T - B;
  const ys = hist.map(p => p.score);
  let lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  if (hi - lo < 10){ lo -= 5; hi += 5; }
  lo = Math.max(0, Math.floor(lo - 2)); hi = Math.min(100, Math.ceil(hi + 2));
  if (hi <= lo) hi = lo + 10;
  const X = i => L + (hist.length === 1 ? iw/2 : (i/(hist.length-1))*iw);
  const Y = v => T + ih - ((v - lo)/(hi - lo))*ih;
  const line = hist.map((p,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.score).toFixed(1)).join(' ');
  const area = line + ' L' + X(hist.length-1).toFixed(1) + ' ' + (T+ih) + ' L' + X(0).toFixed(1) + ' ' + (T+ih) + ' Z';
  const grid = [lo, Math.round((lo+hi)/2), hi].map(v =>
    '<line class="grid" x1="' + L + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W-R) + '" y2="' + Y(v).toFixed(1) + '"/>' +
    '<text class="axis" x="' + (L-7) + '" y="' + (Y(v)+3.5).toFixed(1) + '" text-anchor="end">' + v + '</text>').join('');
  const pts = hist.map((p,i) => '<circle class="pt" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.score).toFixed(1) + '" r="3.5"/>').join('');
  const labs = hist.map((p,i) => {
    if (hist.length > 6 && i % 2) return '';
    return '<text class="axis" x="' + X(i).toFixed(1) + '" y="' + (H-10) + '" text-anchor="middle">' + dtime(p.at).split(' ')[0] + '</text>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
    'aria-label="Biểu đồ điểm rủi ro theo thời gian">' +
    grid + '<path class="area" d="' + area + '"/><path class="line" d="' + line + '"/>' +
    pts + labs + '</svg>';
}

/* ---------- định tuyến ---------- */
function parseRoute(){
  const h = (location.hash || '#/').replace(/^#/, '');
  return h.split('/').filter(Boolean);
}

const SCAN_STEPS = 5;
let scanTimer = null, rlTimer = null;

function stopTimers(){ clearInterval(scanTimer); clearInterval(rlTimer); scanTimer = rlTimer = null; }

function scanPhases(key){
  const raw = rawOf(key);
  const sym = raw ? raw.token.symbol : key.split(':')[1].slice(0, 7);
  State.landing = 'scanning'; State.scanStep = 1; State.scanLabel = sym;
  render();
  const timer = setInterval(() => {
    if (State.scanStep < SCAN_STEPS - 1){
      State.scanStep++;
      const host = $('scanSteps');
      if (host) host.innerHTML = scanStepsHTML(State.scanStep);
    }
  }, 380);
  return timer;
}
function finishScan(key){
  State.landing = 'idle'; State.query = '';
  location.hash = '#/scan/' + key.replace(':', '/');
}
function startScan(key){
  stopTimers();
  if (State.mode === 'offline' || !API.online()){
    scanTimer = scanPhases(key);
    setTimeout(() => { clearInterval(scanTimer); scanTimer = null; finishScan(key); }, 1500);
    return;
  }
  scanTimer = scanPhases(key);
  const parts = key.split(':');
  API.scan(parts[0], parts.slice(1).join(':')).then(r => {
    clearInterval(scanTimer); scanTimer = null;
    const j = r.json;
    if (r.status === 0 || !j){
      State.landing = 'netdown'; render();
      toast('Không gọi được máy chủ dữ liệu.', 'err',
            'Chạy: python3 exit_radar_server.py — hoặc dùng chế độ dữ liệu mẫu.');
      return;
    }
    if (j.error === 'nopool'){ State.landing = 'nopool'; render(); return; }
    if (j.error === 'token'){
      if (j.status === 429 || /limit|429/i.test(String(j.detail || ''))){
        State.landing = 'ratelimit'; render(); startCountdown(key); return;
      }
      if (j.status === 404){ State.query = parts[1] || ''; State.landing = 'notfound'; render(); return; }
      State.landing = 'netdown'; render();
      toast('CMC trả lỗi ' + j.status, 'err', String(j.detail || '').slice(0, 120));
      return;
    }
    adopt(key, j);
    const scored = DIM_ORDER.filter(k => j.dims[k] && j.dims[k].applicable).length;
    toast('Quét xong bằng dữ liệu thật từ CMC.', 'ok',
          j.calls.length + ' lời gọi · ' + scored + '/5 chiều · ' + (j.elapsedMs || 0) + 'ms');
    finishScan(key);
  });
}
function startCountdown(key){
  stopTimers();
  State.rateLeft = 12;
  rlTimer = setInterval(() => {
    State.rateLeft--;
    const el = $('rlCount');
    if (el) el.textContent = State.rateLeft;
    if (State.rateLeft <= 0){
      clearInterval(rlTimer); rlTimer = null;
      toast('Giới hạn API đã hết, quét tiếp.', 'ok');
      startScan(key);
    }
  }, 1000);
}

function resolveQuery(q){
  const low = q.trim().toLowerCase();
  if (!low) return { state:'idle' };
  if (low === 'zzz' || low === 'khongco') return { state:'notfound' };
  if (low === '429') return { state:'ratelimit' };
  if (low === 'new') return { state:'nopool' };
  if (low === 'offline') return { state:'netdown' };
  const hits = searchIndex(low);
  if (!hits.length) return { state:'notfound' };
  if (hits.length === 1) return { state:'go', key:hits[0].key };
  return { state:'ambiguous', list:hits.slice(0,6) };
}
function runScan(q){
  State.query = q;
  const t = q.trim();
  if (API.online() && t.length >= 2 && /^[A-Za-z0-9]{4,}$/.test(t) && !/^(429|new|offline|zzz)$/i.test(t)){
    State.landing = 'scanning'; State.scanStep = 1; State.scanLabel = t.toUpperCase(); render();
    API.search(t).then(js => {
      if (!js || !js.ok || !js.items || !js.items.length){
        const r = resolveQuery(q);
        if (r.state === 'go'){ startScan(r.key); return; }
        State.landing = (js && js.status === 429) ? 'ratelimit' : 'notfound'; render();
        if (State.landing === 'ratelimit') startCountdown('solana:DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263');
        return;
      }
      State.ambiguous = js.items.map(x => ({ key: keyOf(x.chain, x.address), chain: x.chain,
        address: x.address, symbol: x.symbol, name: x.name,
        liquidityUsd: x.liquidityUsd || 0, holders: x.holders || 0 }));
      if (State.ambiguous.length === 1) startScan(State.ambiguous[0].key);
      else { State.landing = 'ambiguous'; render(); }
    });
    return;
  }
  const r = resolveQuery(q);
  if (r.state === 'go'){ startScan(r.key); return; }
  if (r.state === 'ambiguous'){
    State.ambiguous = r.list.sort((a,b) => b.liquidityUsd - a.liquidityUsd);
    State.landing = 'ambiguous'; render(); return;
  }
  if (r.state === 'ratelimit'){
    State.landing = 'ratelimit'; render();
    startCountdown('solana:DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263'); return;
  }
  State.landing = r.state === 'idle' ? 'idle' : r.state;
  render();
}

/* ---------- vẽ ---------- */
function render(){
  stopTimers();
  const p = parseRoute();
  renderNav('#/' + p.join('/'));
  applyTheme();

  if (p.length === 0) main.innerHTML = viewLanding();
  else if (p[0] === 'scan' && p.length >= 3) main.innerHTML = viewResult(p[1], p.slice(2).join('/'));
  else if (p[0] === 'watchlist' && p.length >= 3) main.innerHTML = viewHistory(p[1] + ':' + p.slice(2).join('/'));
  else if (p[0] === 'watchlist') main.innerHTML = viewWatchlist();
  else if (p[0] === 'settings') main.innerHTML = viewSettings();
  else if (p[0] === 'method') main.innerHTML = viewMethod();
  else if (p[0] === 'evidence') main.innerHTML = viewEvidence();
  else if (p[0] === 'about') main.innerHTML = viewAbout();
  else main.innerHTML = viewLanding();

  bind(p);
  paint();
}

/* ---------- gắn sự kiện theo màn ---------- */
function bind(p){
  /* --- màn quét --- */
  const form = $('searchForm');
  if (form){
    form.addEventListener('submit', e => { e.preventDefault(); runScan($('q').value); });
    const q = $('q');
    if (q){
      if (document.activeElement !== q) q.focus();
      let deb = null;
      q.addEventListener('input', () => {
        const v = q.value;
        State.query = v;
        if (API.online()){
          clearTimeout(deb);
          deb = setTimeout(() => {
            API.search(v).then(js => {
              if (!js || !js.ok || !js.items || !js.items.length) return;
              State.ambiguous = js.items.map(x => ({ key: keyOf(x.chain, x.address), chain: x.chain,
                address: x.address, symbol: x.symbol, name: x.name,
                liquidityUsd: x.liquidityUsd || 0, holders: x.holders || 0 }));
              State.landing = 'ambiguous'; render();
              const f = $('q'); if (f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
            });
          }, 320);
          return;
        }
        const hits = searchIndex(v);
        State.suggest = hits.slice(0,6);
        const extra = $('landingExtra');
        if (hits.length > 1 && v.trim().length >= 2){
          State.ambiguous = hits.sort((a,b) => b.liquidityUsd - a.liquidityUsd);
          State.landing = 'ambiguous'; render(); const q2 = $('q');
          if (q2){ q2.focus(); q2.setSelectionRange(v.length, v.length); }
        } else if (State.landing === 'ambiguous' && hits.length <= 1){
          State.landing = hits.length ? 'suggest' : 'idle'; render();
          const q3 = $('q'); if (q3){ q3.focus(); q3.setSelectionRange(v.length, v.length); }
        }
      });
      q.addEventListener('keydown', e => {
        if (e.key === 'Escape'){ q.value = ''; State.landing = 'idle'; State.query = ''; render(); }
      });
    }
    document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
      const v = b.getAttribute('data-ex'); const q4 = $('q'); if (q4) q4.value = v; runScan(v);
    });
    document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => startScan(b.getAttribute('data-open')));
    const cs = $('cancelScan'); if (cs) cs.onclick = () => { stopTimers(); State.landing = 'idle'; render(); };
    const uo = $('useOffline'); if (uo) uo.onclick = () => {
      State.mode = 'offline'; Store.set('er.mode', 'offline'); stopTimers();
      toast('Đã chuyển sang dữ liệu mẫu.', 'ok', 'Không cần mạng, đọc từ fixtures.');
      State.landing = 'idle'; render();
    };
    const bi = $('backIdle'); if (bi) bi.onclick = () => { stopTimers(); State.landing = 'idle'; State.query = ''; render(); };
  }

  /* --- màn kết quả --- */
  const wb = $('watchBtn');
  if (wb) wb.onclick = () => {
    const p2 = parseRoute(), chain = p2[1], addr = p2.slice(2).join('/'), key = keyOf(chain, addr);
    if (State.watch.some(w => w.key === key)) return;
    const v = applyMode(key, State.mode);
    State.watch.unshift({ key, symbol:v.token.symbol, chain, score:v.score, prev:v.score,
      at:new Date().toISOString(), whale:v.whale ? v.whale.verdict : null });
    saveWatch();
    toast('Đã thêm ' + v.token.symbol + ' vào theo dõi.', 'ok', 'Lần quét sau sẽ hiện chênh lệch.');
    render();
  };
  const rb = $('rerunBtn');
  if (rb) rb.onclick = () => {
    const p2 = parseRoute();
    stopTimers();
    const host = document.querySelector('.cols.two');
    if (host) host.style.opacity = '.45';
    toast('Đang quét lại…', 'info');
    setTimeout(() => { window.location.reload(); }, 900);
  };
  const cb = $('copyBtn');
  if (cb) cb.onclick = () => {
    const url = location.href;
    const done = () => toast('Đã sao chép liên kết.', 'ok', url);
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, done);
    else done();
  };

  /* --- màn theo dõi --- */
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const key = b.getAttribute('data-del');
    const w = State.watch.find(x => x.key === key);
    confirmModal({ title:'Xoá ' + (w ? w.symbol : 'token') + ' khỏi theo dõi?',
      body:'Token này sẽ bị xoá khỏi danh sách cục bộ. Không thể hoàn tác.', ok:'Xoá', danger:true,
      onOk(){ State.watch = State.watch.filter(x => x.key !== key); saveWatch();
              toast('Đã xoá khỏi theo dõi.', 'ok'); render(); } });
  });
  document.querySelectorAll('[data-rescan]').forEach(b => b.onclick = () => {
    startScan(b.getAttribute('data-rescan'));
  });
  const ra = $('rerunAll');
  if (ra) ra.onclick = () => {
    ra.setAttribute('aria-disabled','true');
    ra.innerHTML = '<span class="spin"></span>Đang chạy';
    let i = 0;
    const tick = setInterval(() => {
      i++;
      if (i >= State.watch.length){
        clearInterval(tick);
        const stamp = new Date().toISOString();
        State.watch.forEach(w => { w.prev = w.score; w.at = stamp; });
        saveWatch();
        toast('Đã quét lại ' + State.watch.length + ' token.', 'ok', 'Chênh lệch đã được cập nhật.');
        render();
      }
    }, 380);
  };

  /* --- màn cài đặt --- */
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    State.mode = b.getAttribute('data-mode');
    Store.set('er.mode', State.mode);
    toast('Chế độ dữ liệu: ' + MODES[State.mode].vn + '.', 'ok', MODES[State.mode].desc);
    render();
  });
  const tk = $('testKey');
  if (tk) tk.onclick = () => {
    const k = $('cmcKey').value.trim(), host = $('keyResult');
    if (!k){
      host.innerHTML = '<div class="field-err" style="margin-top:12px"><span>✕</span>' +
        '<span>Chưa nhập key. Dán key CMC vào ô trên rồi thử lại.</span></div>'; return;
    }
    host.innerHTML = '<div class="note-box" style="margin-top:14px"><span class="ic">⋯</span>' +
      '<div>Đang hỏi máy chủ nội bộ và gọi thử CMC bằng key này…</div></div>';
    Store.set('er.key', k);
    API.health().then(r => {
      const h = r.json;
      if (!h){
        host.innerHTML = '<div class="note-box err" style="margin-top:14px"><span class="ic">✕</span>' +
          '<div><b>Không gọi được máy chủ nội bộ.</b> Chạy <span class="mono">python3 exit_radar_server.py</span> ' +
          'rồi thử lại. Key chưa được dùng ở đâu cả.</div></div>'; return;
      }
      if (h.cmcReachable && h.keyProvided){
        State.mode = 'full'; Store.set('er.mode', 'full');
        toast('Key đã nhận. Đã bật chế độ đầy đủ.', 'ok', 'Máy chủ sẽ dùng key cho các endpoint cần quyền.');
        render(); return;
      }
      host.innerHTML = '<div class="note-box err" style="margin-top:14px"><span class="ic">✕</span>' +
        '<div><b>Key chưa dùng được.</b> CMC trả mã <span class="mono">' + h.cmcStatus + '</span>. ' +
        'Key sai, chưa kích hoạt, hoặc đang cạn hạn mức. Key không được gửi đi đâu ngoài máy này.</div></div>';
    });
  };
  const ck = $('clearKey');
  if (ck) ck.onclick = () => {
    Store.del('er.key');
    if (State.mode === 'full'){ State.mode = 'public'; Store.set('er.mode','public'); }
    toast('Đã xoá key khỏi trình duyệt.', 'ok'); render();
  };
  document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => {
    State.themePref = b.getAttribute('data-theme-set');
    Store.set('er.themePref', State.themePref);
    applyTheme(); render();
  });
  const sc = $('srvCheck');
  if (sc) sc.onclick = () => {
    const el = $('srvState'); if (el) el.textContent = 'đang kiểm tra…';
    API.health().then(r => {
      const h = r.json, e2 = $('srvState');
      if (!h){ if (e2) e2.textContent = 'không kết nối được'; toast('Không kết nối được máy chủ.', 'err', API.url('/api/health')); return; }
      if (e2) e2.textContent = 'tốt · CMC trả ' + h.cmcStatus + ' · key ' + (h.keyProvided ? 'có' : 'không');
      toast('Máy chủ hoạt động.', 'ok', 'CMC: ' + h.cmcStatus + ' · cache ' + h.cacheTtlSec + 's');
    });
  };
  const se = $('srvEdit');
  if (se) se.onclick = () => {
    const v = window.prompt('Địa chỉ máy chủ dữ liệu:', API.base);
    if (v){ API.base = v.trim(); Store.set('er.api', API.base); toast('Đã đổi địa chỉ máy chủ.', 'ok', API.base); render(); }
  };
  const wipe = $('wipe');
  if (wipe) wipe.onclick = () => confirmModal({
    title:'Xoá toàn bộ dữ liệu cục bộ?',
    body:'Watchlist, key CMC và tuỳ chọn giao diện sẽ bị xoá khỏi trình duyệt này. <b>Không thể hoàn tác.</b>',
    ok:'Xoá tất cả', danger:true,
    onOk(){
      ['er.watch','er.key','er.mode','er.themePref'].forEach(k => Store.del(k));
      State.watch = []; State.mode = 'public'; State.themePref = 'system';
      toast('Đã xoá toàn bộ dữ liệu cục bộ.', 'ok'); render();
    }
  });
  document.querySelectorAll('[data-state]').forEach(b => b.onclick = () => {
    const s = b.getAttribute('data-state');
    const G = k => '#/scan/' + DEMO[k].token.chain + '/' + DEMO[k].token.address;
    const BONK = 'solana:DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263';
    const LOW  = 'bnb-chain:PEPE2bnb11111111111111111111111111111';
    if (s === 'notfound'){ State.query = '0x0000000000000000000000000000000000000000'; State.landing = 'notfound'; location.hash = '#/'; render(); return; }
    if (s === 'ambiguous'){
      State.query = 'PEPE'; State.landing = 'ambiguous';
      State.ambiguous = searchIndex('pepe').sort((a,b) => b.liquidityUsd - a.liquidityUsd);
      location.hash = '#/'; render(); return;
    }
    if (s === 'ratelimit'){ State.landing = 'ratelimit'; location.hash = '#/'; render(); startCountdown(BONK); return; }
    if (s === 'netdown'){ State.landing = 'netdown'; location.hash = '#/'; render(); return; }
    if (s === 'nopool'){ State.landing = 'nopool'; location.hash = '#/'; render(); return; }
    if (s === 'partial' || s === 'nokey'){
      State.mode = 'public'; Store.set('er.mode','public');
      toast(s === 'nokey' ? 'Chế độ công khai — chưa có key.' : 'Chế độ công khai: chỉ 3/5 chiều.',
        'info', s === 'nokey' ? 'Bật chế độ đầy đủ để chấm thêm D và E.' : 'Chiều D và E hiện “không áp dụng”.');
      location.hash = G(BONK); return;
    }
    if (s === 'lowcov'){ location.hash = G(LOW); return; }
  });
}

/* ---------- khởi động ---------- */
window.addEventListener('hashchange', render);
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);
themeBtn.onclick = () => {
  const order = ['dark','light','system'];
  State.themePref = order[(order.indexOf(State.themePref) + 1) % 3];
  Store.set('er.themePref', State.themePref);
  applyTheme();
  toast('Giao diện: ' + (State.themePref === 'dark' ? 'tối' : State.themePref === 'light' ? 'sáng' : 'theo hệ thống'), 'info');
};

applyTheme();
render();

</script>
