<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit Radar — Kiểm tra token DEX trước khi mua</title>
<meta name="description" content="Chấm điểm rủi ro cấu trúc và dòng tiền ví lớn của token DEX, dựng trên dữ liệu CoinMarketCap.">
<style>
/* ==========================================================================
   EXIT RADAR — design tokens
   Đổi theme chỉ bằng khối [data-theme]. Không component nào hardcode màu.
   ========================================================================== */
:root{
  /* bề mặt */
  --bg:#17181B; --surface:#1D1F24; --surface-2:#24262C; --surface-3:#2C2F36;
  --border:#2E3138; --border-strong:#41454E;
  /* chữ */
  --text:#FFFFFF; --muted:#A6B0C3; --faint:#858CA2;
  /* mức rủi ro — CMC green-500 / orange-500 / cam đậm / red-500 */
  --risk-low:#16C784; --risk-watch:#EE8B2A; --risk-high:#E4572E; --risk-critical:#EA3943;
  --buy:#16C784; --sell:#EA3943; --chart-a:#5B8DEF; --chart-b:#A78BFA;
  /* nhấn — chỉ một màu */
  --accent:#3861FB; --accent-2:#486DF7; --accent-ink:#FFFFFF;
  --accent-soft:rgba(56,97,251,.14); --accent-line:rgba(56,97,251,.42);
  /* trạng thái */
  --ok:#16C784; --warn:#EE8B2A; --err:#EA3943;
  --focus:#486DF7;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -18px rgba(0,0,0,.75);
  --sk-base:#24262C; --sk-hi:#33363E;
  /* thang 4px */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-full:999px;
  /* chữ */
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --t-xs:12px; --t-sm:13px; --t-base:15px; --t-md:17px;
  --t-lg:20px; --t-xl:26px; --t-2xl:34px; --t-3xl:44px;
  --nav-h:57px;
}
[data-theme="light"]{
  --bg:#FFFFFF; --surface:#F8FAFD; --surface-2:#EFF2F5; --surface-3:#E1E6ED;
  --border:#DCE1EA; --border-strong:#C7CDD8;
  --text:#17181B; --muted:#616E85; --faint:#858CA2;
  --risk-low:#0B8A5D; --risk-watch:#B4660F; --risk-high:#BE4A18; --risk-critical:#C4292F;
  --buy:#0B8A5D; --sell:#C4292F; --chart-a:#2A55D6; --chart-b:#6D3FD4;
  --accent:#2A4FD0; --accent-2:#3861FB; --accent-ink:#FFFFFF;
  --accent-soft:rgba(42,79,208,.09); --accent-line:rgba(42,79,208,.4);
  --ok:#0B8A5D; --warn:#B4660F; --err:#C4292F;
  --focus:#3861FB;
  --shadow:0 1px 2px rgba(20,24,31,.07), 0 14px 30px -18px rgba(20,24,31,.35);
  --sk-base:#E7EBF1; --sk-hi:#F2F5F9;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:var(--t-base); line-height:1.55;
  font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4,h5,p{margin:0}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--space-5)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skiplink{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--accent-ink);
  padding:10px 16px;z-index:99;border-radius:0 0 var(--radius-sm) 0}
.skiplink:focus{left:0}

/* ==========================================================================
   THANH ĐIỀU HƯỚNG
   ========================================================================== */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--border)}
.topbar .wrap{display:flex;align-items:center;gap:var(--space-5);height:var(--nav-h)}
.brand{font-family:var(--mono);font-size:var(--t-sm);letter-spacing:.14em;font-weight:700;
  color:var(--text);display:flex;align-items:center;gap:8px;flex:none}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.nav{display:flex;gap:var(--space-5);align-items:center}
.nav a{color:var(--muted);font-size:var(--t-sm);padding:4px 0;position:relative;white-space:nowrap}
.nav a:hover{color:var(--text)}
.nav a.on{color:var(--text)}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent)}
.topright{margin-left:auto;display:flex;align-items:center;gap:var(--space-2);flex:none}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;background:transparent;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--accent-2)}
.bottombar{display:none}
@media (max-width:639px){
  .nav{display:none}
  .topbar .wrap{height:52px}
  .bottombar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;
    z-index:45;background:var(--surface);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom)}
  .bottombar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:56px;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
  .bottombar a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
  .bottombar a.on{color:var(--accent)}
  body{padding-bottom:64px}
}

/* ==========================================================================
   NÚT
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:40px;padding:9px 16px;background:var(--surface-2);color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  font-size:var(--t-sm);font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .12s ease,border-color .12s ease,transform .06s ease}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{border-color:var(--err);color:var(--err);background:transparent}
.btn.danger:hover{background:color-mix(in srgb,var(--err) 12%,transparent)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:var(--t-xs)}
.btn.lg{min-height:46px;padding:12px 22px;font-size:var(--t-base)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn .spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ==========================================================================
   Ô NHẬP
   ========================================================================== */
.input{width:100%;min-height:44px;padding:10px 13px;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  color:var(--text);font-family:var(--mono);font-size:var(--t-sm)}
.input::placeholder{color:var(--faint);font-family:var(--sans)}
.input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--accent-2)}
.input[aria-invalid="true"]{border-color:var(--err)}
select.input{font-family:var(--sans);cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.field-help{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px}
.field-err{font-family:var(--mono);font-size:11.5px;color:var(--err);margin-top:6px;
  display:flex;gap:6px;align-items:flex-start}

/* ==========================================================================
   BADGE
   ========================================================================== */
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.04em;padding:3px 9px;border-radius:var(--radius-full);
  border:1px solid var(--border-strong);color:var(--muted);white-space:nowrap}
.badge.full{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.badge.off{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.badge.low{color:var(--risk-low);border-color:color-mix(in srgb,var(--risk-low) 50%,transparent)}
.badge.watch{color:var(--risk-watch);border-color:color-mix(in srgb,var(--risk-watch) 50%,transparent)}
.badge.high{color:var(--risk-high);border-color:color-mix(in srgb,var(--risk-high) 50%,transparent)}
.badge.crit{color:var(--risk-critical);border-color:color-mix(in srgb,var(--risk-critical) 50%,transparent)}

/* ==========================================================================
   THẺ
   ========================================================================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
.card.pad{padding:var(--space-5)}
.card-h{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:var(--space-3);font-weight:600}
.page-h{display:flex;align-items:flex-start;gap:var(--space-4);flex-wrap:wrap;
  padding:var(--space-6) 0 var(--space-5)}
.page-h h1{font-size:var(--t-xl);font-weight:650;letter-spacing:-.02em}
.page-h .sub{color:var(--muted);font-size:var(--t-sm);margin-top:var(--space-1)}
.page-h .right{margin-left:auto;display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.crumb{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;
  color:var(--faint);margin-bottom:var(--space-2)}
.crumb a{color:var(--faint)}
.crumb a:hover{color:var(--accent)}

/* dòng thông tin có đường dẫn chấm — thiết bị chữ ký */
.led{padding:var(--space-3) 0}
.row{display:flex;align-items:baseline;gap:var(--space-3);font-size:var(--t-sm);padding:7px 0}
.row .lead{flex:1;border-bottom:1px dotted var(--border-strong);transform:translateY(-3px);min-width:12px}
.row .v{font-family:var(--mono);white-space:nowrap;color:var(--text)}
.row .k{color:var(--muted)}
.row .v.pos{color:var(--warn)}
.row .v.neg{color:var(--ok)}

/* ==========================================================================
   THẺ KẾT LUẬN — 4 mức
   ========================================================================== */
.verdict{border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  background:var(--surface);overflow:hidden;position:relative}
.verdict::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vc,var(--muted))}
.verdict.low{--vc:var(--risk-low)} .verdict.watch{--vc:var(--risk-watch)}
.verdict.high{--vc:var(--risk-high)} .verdict.crit{--vc:var(--risk-critical)}
.verdict.none{--vc:var(--faint)}
.v-top{display:flex;align-items:center;gap:var(--space-5);padding:var(--space-5) var(--space-5) var(--space-4);
  border-bottom:1px solid var(--border)}
.v-score{font-family:var(--mono);font-size:var(--t-3xl);line-height:1;font-weight:700;letter-spacing:-.03em}
.v-lvl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;margin-bottom:6px}
.v-lvl.low{color:var(--risk-low)} .v-lvl.watch{color:var(--risk-watch)}
.v-lvl.high{color:var(--risk-high)} .v-lvl.crit{color:var(--risk-critical)}
.v-lvl.none{color:var(--muted)}
.v-cov{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted)}
.v-cov b{color:var(--text);font-weight:600}
.track{height:5px;background:var(--surface-3);border-radius:var(--radius-full);
  margin-top:6px;overflow:hidden;width:142px}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.v-reasons{padding:var(--space-2) var(--space-5) var(--space-4)}
/* --- tầng bằng chứng: bảng số liệu + biểu đồ --- */
.ev-sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.ev-sec h3{font-size:var(--t-md);font-weight:600;margin:0 0 6px;line-height:1.35}
.ev-sec p.sub{color:var(--muted);font-size:var(--t-sm);margin:0 0 12px;max-width:78ch}
.ev-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin:0 0 16px}
table.ev-table{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
table.ev-table th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.ev-table th.r,table.ev-table td.n{text-align:right}
table.ev-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
table.ev-table tr:last-child td{border-bottom:0}
table.ev-table td.n{font-variant-numeric:tabular-nums}
.addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
a.addr-link{text-decoration:none;border-bottom:1px dotted var(--border)}
a.addr-link:hover{border-bottom-style:solid}
.side-buy{color:var(--buy);font-weight:600}
.side-sell{color:var(--sell);font-weight:600}
.sharebar{display:inline-block;height:7px;width:56px;border-radius:4px;background:var(--border);position:relative;vertical-align:middle;margin-left:6px}
.sharebar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:currentColor;opacity:.55}
.chart{width:100%;height:auto;display:block;margin:0 0 6px}
.mv.up{color:var(--buy)} .mv.down{color:var(--sell)}
[data-ev]{cursor:pointer;border-radius:6px;transition:background .15s ease,box-shadow .15s ease}
[data-ev]:hover,[data-ev]:focus-visible{background:color-mix(in srgb,var(--chart-a) 14%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--chart-a) 45%,transparent)}
[data-ev]::after{content:'↗';font-family:var(--mono);font-size:9px;opacity:.4;margin-left:5px;vertical-align:super;transition:opacity .15s}
[data-ev]:hover::after{opacity:1}
.copy-btn{margin-left:6px;font-family:var(--mono);font-size:11px;line-height:1;color:var(--muted);
  background:transparent;border:1px solid var(--border);border-radius:5px;padding:2px 5px;cursor:pointer;vertical-align:middle}
.copy-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-2)}
.tbl-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.tbl-bar input{font:inherit;font-size:var(--t-sm);padding:6px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);min-width:170px}
.tbl-bar .hint{font-size:11px;color:var(--faint)}
table.ev-table th.sortable{cursor:pointer;user-select:none}
table.ev-table th.sortable:hover{color:var(--text)}
table.ev-table th[data-dir]:after{content:' ▲';font-size:8px;opacity:.7}
table.ev-table th[data-dir="desc"]:after{content:' ▼'}
.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.filterbar input,.filterbar select{font:inherit;font-size:var(--t-sm);padding:7px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
.filterbar input{min-width:190px}
.filterbar .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip.f{cursor:pointer;background:transparent}
.chip.f.on{border-color:var(--accent-2);color:var(--text);background:color-mix(in srgb,var(--chart-a) 16%,transparent)}
.chip.rwa{color:#fff;background:color-mix(in srgb,var(--chart-b) 78%,transparent);border-color:transparent;font-weight:600;
  font-size:9.5px;letter-spacing:.07em;padding:1px 7px;vertical-align:1px;margin-left:6px}
.chip.rwa-t{cursor:pointer;background:transparent;font-family:var(--mono)}
.chip.rwa-t:hover{border-color:var(--accent-2);background:var(--surface-2)}
.chip.rwa-t b{font-weight:600}
.chip.rwa-t b.up{color:var(--buy)} .chip.rwa-t b.down{color:var(--sell)}
.sticky-actions.on-top{position:sticky;top:calc(var(--nav-h) + 8px);z-index:25;margin:0 0 var(--space-4);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px)}
.radar svg{width:100%;max-width:168px;height:auto;display:block;margin:0 auto}
.radar .caveat{margin-top:6px}
.wbar{margin:10px 0 2px}
.wbar-row{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:var(--t-sm)}
.wbar-row .k{flex:0 0 176px;color:var(--muted)}
.wbar-track{flex:1;height:9px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.wbar-track i{display:block;height:100%;border-radius:5px}
.wbar-track i.buy{background:var(--buy)} .wbar-track i.sell{background:var(--sell)}
.wbar-row .v{flex:0 0 86px;text-align:right;font-family:var(--mono);font-size:var(--t-xs)}
.pbar{margin:6px 0 2px}
.pbar-row{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:var(--t-xs)}
.pbar-row .k{flex:0 0 136px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11px}
.pbar-track{flex:1;height:8px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.pbar-track i{display:block;height:100%;background:var(--chart-a);border-radius:5px;opacity:.85}
.pbar-row .v{flex:0 0 80px;text-align:right;font-family:var(--mono);font-size:var(--t-xs)}
.hlines svg{width:100%;height:auto;display:block}
.hlines .card-h{margin-bottom:6px}
/* --- module theo dõi: sparkline, luật cảnh báo, nhật ký --- */
.spark{width:64px;height:18px;display:inline-block;vertical-align:middle;margin-left:8px}
.wl-score{font-family:var(--mono);font-weight:600}
.wl-note{display:block;color:var(--muted);font-size:11px;margin-top:2px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-dash,.wl-flat{color:var(--faint)}
.pill.in{color:var(--buy);border-color:color-mix(in srgb,var(--buy) 45%,transparent)}
.chip.wl-rule{background:transparent;font-size:10px;padding:1px 7px;margin:0 4px 2px 0;color:var(--muted)}
.wl-badge{display:inline-block;min-width:16px;text-align:center;background:var(--sell);color:#fff;
  border-radius:999px;font-size:9.5px;line-height:15px;padding:0 4px;margin-left:5px;font-weight:700}
.wl-form{display:grid;gap:12px}
.wl-fld{display:grid;gap:4px;font-size:var(--t-sm)}
.wl-fld span{font-weight:600}
.wl-fld em{color:var(--muted);font-size:11px;font-style:normal}
.wl-fld input[type=number]{font:inherit;font-size:var(--t-sm);padding:7px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);max-width:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:4px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gate{border:1px dashed var(--border);border-radius:10px;padding:14px 16px;color:var(--muted);font-size:var(--t-sm);line-height:1.6}
.gate b{color:inherit}
/* --- dải dữ liệu thị trường trên trang chủ --- */
.market{margin:26px 0 10px;border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:left}
.mkt-h{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.mkt-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:16px}
.mkt-card{display:flex;flex-direction:column;gap:3px}
.mkt-card .mk{font-size:11px;color:var(--muted)}
.mkt-card .mv{font-size:var(--t-md);font-weight:600;font-variant-numeric:tabular-nums}
.mkt-card .mv.sm{font-size:var(--t-sm);font-weight:500;color:var(--muted)}

.chip{display:inline-block;font-size:11px;padding:3px 9px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}
.reason{display:flex;align-items:baseline;gap:var(--space-3);padding:9px 0;font-size:var(--t-sm)}
.reason + .reason{border-top:1px solid var(--border)}
.reason .n{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 14px}

/* ==========================================================================

.meter .track{width:100%;height:6px;margin-top:6px}
.meter .track i{border-radius:var(--radius-full)}
.meter.na .name,.meter.na .val{color:var(--faint)}
.meter.na .track{background:repeating-linear-gradient(135deg,var(--surface-3) 0 5px,transparent 5px 10px)}
.meter .ep{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px;display:block}

/* ==========================================================================

.flow{border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--surface-2);padding:var(--space-4) var(--space-5);margin-top:var(--space-4)}

.tbl{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:500;padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap}

<script>
/* ==========================================================================
   EXIT RADAR — Web UI một trang
   Không tài khoản · không đăng nhập · không thanh toán.
   Toàn bộ trạng thái nằm trong trình duyệt; chỉ có lời gọi ra CMC API.

   HỢP ĐỒNG DỮ LIỆU — đây là cấu trúc duy nhất mà giao diện đọc.
   Để nối vào lõi Python, thay `DEMO` bằng kết quả thật của
   `exitradar scan <token> --json`:
   {
     token:  { chain, address, symbol, name, priceUsd, liquidityUsd, holders, poolAgeDays }
     mode:   'public' | 'full' | 'offline'
     dims:   { A:{score,max,label,endpoint,applicable}, B.., C.., D.., E.. }
     reasons:[ { text, value, max, dim, endpoint } ]
     whale:  { inCount, inUsd, outCount, outUsd, suspiciousPct, verdict }
     history:[ { at, score, liquidityUsd, holders } ]
     calls:  [ { path, status, ms } ]
     fetchedAt: <ISO string>
   }
   ========================================================================== */

/* ---------- lưu trữ an toàn: chế độ xem trước có thể chặn localStorage ---------- */
const Store = (() => {
  let ok = true;
  try { localStorage.setItem('__er','1'); localStorage.removeItem('__er'); }
  catch(e){ ok = false; }
  const mem = {};
  return {
    available: ok,
    get(k, fb){ try { const v = ok ? localStorage.getItem(k) : mem[k]; return v==null ? fb : JSON.parse(v); }
                catch(e){ return fb; } },
    set(k, v){ try { const s = JSON.stringify(v); if(ok) localStorage.setItem(k, s); else mem[k] = s; }
               catch(e){} },
    del(k){ try { if(ok) localStorage.removeItem(k); else delete mem[k]; } catch(e){} }
  };
})();

/* ---------- hằng số ---------- */
const LEVELS = {
  low:      { vn:'Thấp',         cls:'low',  range:'0–24'   },
  watch:    { vn:'Để mắt',       cls:'watch',range:'25–49'  },
  high:     { vn:'Cao',          cls:'high', range:'50–74'  },
  critical: { vn:'Nghiêm trọng', cls:'crit', range:'75–100' }
};
const MODES = {
  public:  { vn:'Công khai', badge:'công khai · 3/5', cls:'',     dims:['A','B','E'],
             desc:'Không cần key. Chấm được thanh khoản, holder và dòng tiền ví lớn.' },
  full:    { vn:'Đầy đủ',    badge:'đầy đủ · 5/5',    cls:'full', dims:['A','B','C','D','E'],
             desc:'Cần key CMC Pro. Chấm 5/5 chiều.' },
  offline: { vn:'Dữ liệu mẫu', badge:'dữ liệu mẫu',   cls:'off',  dims:['A','B','C','D','E'],
             desc:'Không gọi mạng. Đọc lại fixtures đã chụp.' }
};
const DIM_ORDER = ['A','B','C','D','E'];
const CHAINS = { solana:'Solana', ethereum:'Ethereum', 'bnb-chain':'BNB Chain', base:'Base', arbitrum:'Arbitrum', polygon:'Polygon' };

const levelOf = s => s >= 75 ? 'critical' : s >= 50 ? 'high' : s >= 25 ? 'watch' : 'low';

/* ---------- định dạng số kiểu Việt Nam: phân cách nghìn bằng dấu chấm ---------- */
function nf(n, d){
  d = d || 0;
  const neg = n < 0; n = Math.abs(n);
  let s = d > 0 ? n.toFixed(d) : String(Math.round(n));
  let p = s.split('.');
  const int = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '−' : '') + int + (p[1] ? ',' + p[1] : '');
}
function usd(n){
  const a = Math.abs(n), sg = n < 0 ? '−' : '';
  if (a >= 1e9) return sg + '$' + nf(a/1e9, 1) + 'B';
  if (a >= 1e6) return sg + '$' + nf(a/1e6, 1) + 'M';
  if (a >= 1e3) return sg + '$' + nf(a/1e3, 0) + 'K';
  return sg + '$' + nf(a, 0);
}
function usdExact(n){ return (n < 0 ? '−' : '') + '$' + nf(Math.abs(n), 0); }
function price(n){
  let s = nf(n, 7).replace(/0+$/, '').replace(/,$/, '');
  return '$' + s;
}
function signed(n, d){ return (n > 0 ? '+' : n < 0 ? '−' : '') + nf(Math.abs(n), d || 0); }
function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.round(s) + ' giây trước';
  if (s < 3600) return Math.round(s/60) + ' phút trước';
  if (s < 86400) return Math.round(s/3600) + ' giờ trước';
  return Math.round(s/86400) + ' ngày trước';
}
function dtime(iso){
  const d = new Date(iso);
  const p = x => String(x).padStart(2, '0');

const LIVE = {};
function rawOf(key){ return LIVE[key] || DEMO[key] || null; }

/* Cầu nối tới máy chủ nội bộ. Không gọi thẳng CMC được: CMC không gửi
   header CORS, đã kiểm chứng bằng thực nghiệm. */
const API = {
  base: Store.get('er.api', (location.origin && location.origin.indexOf('http') === 0)
        ? location.origin : 'http://127.0.0.1:8787'),
  state: { reachable:null, keyProvided:false, lastError:null, stats:null, health:null },
  url(p){ return String(this.base).replace(/\/$/, '') + p; },
  key(){ return Store.get('er.key', ''); },
  headers(){ const h = {'Accept':'application/json'}; const k = this.key(); if (k) h['X-CMC-Key'] = k; return h; },
  async get(p, ms){
    const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const t = setTimeout(() => { if (ctl) ctl.abort(); }, ms || 30000);
    try {
      const r = await fetch(this.url(p), { headers: this.headers(), signal: ctl ? ctl.signal : undefined });
      const j = await r.json().catch(() => null);
      this.state.reachable = true;
      return { ok: r.ok, status: r.status, json: j };
    } catch (e) {
      this.state.reachable = false;
      this.state.lastError = String((e && e.message) || e);
      return { ok:false, status:0, json:null, error:this.state.lastError };
    } finally { clearTimeout(t); }
  },
  async health(){
    const r = await this.get('/api/health', 9000);
    this.state.health = r.json || null;
    if (r.json) this.state.keyProvided = !!r.json.keyProvided;
    return r;
  },
  search(q){ return this.get('/api/search?q=' + encodeURIComponent(q), 20000).then(r => r.json); },
  scan(chain, address){
    return this.get('/api/scan?platform=' + encodeURIComponent(chain) + '&address=' + encodeURIComponent(address), 45000);
  },
  online(){ return State.mode !== 'offline'; }
};
function adopt(key, payload){
  LIVE[key] = payload;
  if (!DEMO[key]) DEMO[key] = payload;
  return payload;
}

function applyMode(key, mode){
  const raw = rawOf(key);
  if (!raw) return null;
  const allowed = MODES[mode].dims;
  const dims = {}; let rawSum = 0, maxSum = 0, scored = 0;
  DIM_ORDER.forEach(k => {
    const d = raw.dims[k];
    const ap = !!d.applicable && allowed.indexOf(k) !== -1;
    dims[k] = Object.assign({}, d, { applicable: ap });
    if (ap){ rawSum += d.score; maxSum += d.max; scored++; }
  });
  const coverage = maxSum;
  const score = maxSum ? Math.max(0, Math.round(rawSum / maxSum * 100)) : 0;
  return Object.assign({}, raw, {
    key, mode, dims, scoreRaw: rawSum, scoreMax: maxSum, coverage, scored,
    score, level: levelOf(score),
    reasons: (raw.reasons || []).filter(r => dims[r.dim] && dims[r.dim].applicable)
  });
}

function barRow(vals, max){

function loadMarkets(el){

    .then(r => r.json())

function acctURL(chain, a){ const e = EXPL[chain]; return (e && a) ? e[1] + a : null; }

const EXPLORERS = {
  solana:{ a:'https://solscan.io/account/', t:'https://solscan.io/tx/' },
  ethereum:{ a:'https://etherscan.io/address/', t:'https://etherscan.io/tx/' },

function explorerURL(kind, value){

}
function addrHTML(a, url){
  if (!a) return '<span class="muted">—</span>';
  const full = String(a);
  const s = full.length > 20 ? full.slice(0,8) + '…' + full.slice(-6) : full;
  let href = url;
  if (!href){
    if (/^0x[0-9a-fA-F]{64}$/.test(full)) href = explorerURL('t', full);          // ma giao dich EVM
    else if (/^[1-9A-HJ-NP-Za-km-z]{80,90}$/.test(full)) href = explorerURL('t', full);  // chu ky Solana
    else if (/^0x[0-9a-fA-F]{40}$/.test(full)) href = explorerURL('a', full);     // dia chi vi EVM
    else if (/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(full)) href = explorerURL('a', full);  // dia chi Solana
  }
  const inner = '<span class="addr" title="' + esc(full) + '">' + esc(s) + '</span>';

function tsShort(ms){

/* Biểu đồ thanh khoản: dữ liệu gốc chỉ là SỰ KIỆN thay đổi, nên phải lùi từ
   mức hiện tại qua từng sự kiện. Sai số tích luỹ về quá khứ — có ghi rõ. */
function liqChart(evts, tlu){
  const ev = (evts || []).filter(e => e && e.ts && e.usd).sort((a,b) => a.ts - b.ts);
  if (ev.length < 2 || !tlu) return '';
  let cur = tlu;
  const pts = [{ t: Date.now(), v: tlu }];
  for (let i = ev.length - 1; i >= 0; i--){
    const ch = (ev[i].side === 'remove' ? -1 : 1) * Math.abs(ev[i].usd);
    cur = Math.max(0, cur - ch);
    pts.unshift({ t: ev[i].ts, v: cur });
  }
  const W = 640, H = 170, PL = 8, PR = 8, PT = 16, PB = 20;
  const vs = pts.map(p => p.v), mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs), span = (mx - mn) || 1;
  const x = i => PL + (W - PL - PR) * (i / (pts.length - 1));
  const y = v => PT + (H - PT - PB) * (1 - (v - mn) / span);
  const line = pts.map((p,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = line + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H-PB) + ' L' + PL + ' ' + (H-PB) + ' Z';
  const rm = ev.filter(e => e.side === 'remove').reduce((a,e) => a + Math.abs(e.usd), 0);
  const ad = ev.filter(e => e.side === 'add').reduce((a,e) => a + Math.abs(e.usd), 0);
  return '<div class="card pad"><div class="card-h">Thanh khoản dựng lại từ ' + ev.length +
      ' sự kiện thêm/rút · hiện tại ' + usd(tlu) + '</div>' +
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Thanh khoản dựng lại theo thời gian">' +
      '<path d="' + area + '" fill="currentColor" opacity="0.10"></path>' +
      '<path d="' + line + '" fill="none" stroke="currentColor" stroke-width="2"></path>' +
    '</svg>' +
    '<div class="legend"><span><i style="background:currentColor;opacity:.5"></i>đường dựng lại</span>' +
      '<span>+' + usd(ad) + ' thêm vào</span><span>−' + usd(rm) + ' rút ra</span>' +
      '<span>thấp nhất ' + usd(mn) + ' · cao nhất ' + usd(mx) + '</span></div>' +
    '<p class="caveat">Dữ liệu gốc là <b>sự kiện thay đổi</b>, không phải ảnh chụp thanh khoản theo thời gian. ' +
      'Đường này lùi từ mức hiện tại ' + usd(tlu) + ' qua từng sự kiện, nên càng về quá khứ càng nhiều sai số.</p></div>';
}

function flowChart(rows){
  const rs = (rows || []).filter(r => r && r.ts && r.usd);
  if (rs.length < 4) return '';
  const bk = {};
  rs.forEach(r => {
    const k = Math.floor(r.ts / 900000) * 900000;
    const b = bk[k] || (bk[k] = { buy:0, sell:0 });
    if (r.side === 'sell') b.sell += r.usd; else b.buy += r.usd;
  });
  const ks = Object.keys(bk).map(Number).sort((a,b) => a - b);
  const W = 640, H = 150, PT = 12, PB = 22;
  const mx = Math.max.apply(null, ks.map(k => Math.max(bk[k].buy, bk[k].sell))) || 1;
  const bw = (W - 16) / ks.length;
  let bars = '';
  ks.forEach((k,i) => {
    const b = bk[k], hb = (H - PT - PB) * (b.buy / mx), hs = (H - PT - PB) * (b.sell / mx), x = 8 + i * bw;
    if (hb > 0.4) bars += '<rect x="' + x.toFixed(1) + '" y="' + (H-PB-hb).toFixed(1) + '" width="' + Math.max(1, bw*0.42).toFixed(1) + '" height="' + hb.toFixed(1) + '" fill="var(--buy)" opacity=".9"></rect>';
    if (hs > 0.4) bars += '<rect x="' + (x + bw*0.45).toFixed(1) + '" y="' + (H-PB-hs).toFixed(1) + '" width="' + Math.max(1, bw*0.42).toFixed(1) + '" height="' + hs.toFixed(1) + '" fill="var(--sell)" opacity=".9"></rect>';
  });
  return '<div class="card pad"><div class="card-h">Mua/bán theo khung 15 phút · ' + rs.length + ' lệnh gần nhất</div>' +
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Khối lượng mua bán theo khung 15 phút">' +
      bars + '<line x1="0" y1="' + (H-PB) + '" x2="' + W + '" y2="' + (H-PB) + '" stroke="currentColor" opacity=".25"></line>' +
    '</svg>' +
    '<div class="legend"><span><i style="background:var(--buy)"></i>mua</span>' +
      '<span><i style="background:var(--sell)"></i>bán</span>' +
      '<span>khung lớn nhất ' + usdExact(mx) + '</span></div>' +
    '<p class="caveat">Mỗi cột là tổng giá trị USD trong một khung 15 phút. Đây là màu của <b>chiều dòng tiền</b>, ' +
      'không phải mức rủi ro — thang rủi ro bốn bậc nằm ở cột trái.</p></div>';
}

/* ==========================================================================
   BỘ BIỂU ĐỒ — quy ước màu thống nhất: MUA = xanh (--buy) · BÁN = đỏ (--sell).
   Mọi biểu đồ đều có chú giải và một dòng nói rõ cách đọc.
   ========================================================================== */
function chartLegend(items){
  return '<div class="legend">' + (items || []).map(it =>
    '<span><i style="background:' + it.c + '"></i>' + esc(it.t) + (it.v ? ' · ' + esc(it.v) : '') + '</span>').join('') + '</div>';
}
function radarSVG(dims, size){
  const order = DIM_ORDER, S = size || 168, C = S / 2, R = C - 30, n = order.length;
  const ang = i => -Math.PI / 2 + (2 * Math.PI * i) / n;
  const pt = (i, f) => [C + Math.cos(ang(i)) * R * f, C + Math.sin(ang(i)) * R * f];
  let g = '';
  [0.25, 0.5, 0.75, 1].forEach(f => {
    g += '<polygon points="' + order.map((k, i) => pt(i, f).map(x => x.toFixed(1)).join(',')).join(' ') +
      '" fill="none" stroke="currentColor" stroke-opacity="' + (f === 1 ? .32 : .14) + '"/>';
  });
  order.forEach((k, i) => {
    const a = pt(i, 1), l = pt(i, 1.26);
    g += '<line x1="' + C + '" y1="' + C + '" x2="' + a[0].toFixed(1) + '" y2="' + a[1].toFixed(1) + '" stroke="currentColor" stroke-opacity=".14"/>' +
      '<text x="' + l[0].toFixed(1) + '" y="' + (l[1] + 3.5).toFixed(1) + '" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".75">' + k + '</text>';
  });
  const val = k => { const d = dims[k] || {}; return (d.applicable && d.max) ? Math.max(0, Math.min(1, d.score / d.max)) : 0; };
  const poly = order.map((k, i) => pt(i, val(k)).map(x => x.toFixed(1)).join(',')).join(' ');
  const dots = order.map((k, i) => { const q = pt(i, val(k));
    return '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="2.8" fill="currentColor" opacity="' + (val(k) ? .95 : .3) + '"/>'; }).join('');
  const miss = order.filter(k => !(dims[k] || {}).applicable);
  return '<div class="radar" style="color:var(--vc,var(--muted))">' +
    '<svg viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="Biểu đồ radar năm chiều, mỗi trục tính theo mức tối đa của chiều đó">' + g +
    '<polygon points="' + poly + '" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="1.8"/>' + dots + '</svg>' +
    '<p class="caveat" style="text-align:center">Radar 5 chiều · mỗi trục là <b>phần trăm của mức tối đa chiều đó</b> ' +
    '(A 30 · B 25 · C 20 · D 10 · E 15). Càng rộng càng rủi ro.' +
    (miss.length ? ' ' + miss.length + ' chiều không lấy được dữ liệu nằm ở tâm.' : '') + '</p></div>';
}
function whaleBars(w){
  if (!w) return '';
  const inn = w.inUsd || 0, outd = w.outUsd || 0, mx = Math.max(inn, outd, 1);
  const wpx = v => Math.max(2, Math.round(Math.min(1, v / mx) * 100));
  const net = outd - inn;
  return '<div class="wbar">' +
    '<div class="wbar-row"><span class="k">Mua vào · holder lớn tăng vị thế (' + w.inCount + ' ví)</span>' +

      '<span class="v">' + usdExact(inn).replace('+', '') + '</span></div>' +

    chartLegend([{ c:'var(--buy)', t:'mua · xanh' }, { c:'var(--sell)', t:'bán · đỏ' },
      { c:'var(--muted)', t:'ròng', v:(net > 0 ? '−' : '+') + usdExact(Math.abs(net)).replace('−', '').replace('+', '') }]) + '</div>';

function poolBars(pools, max){
  const ps = (pools || []).filter(x => x && x.liqUsd).sort((a, b) => b.liqUsd - a.liqUsd).slice(0, max || 8);
  if (ps.length < 2) return '';
  const mx = Math.max.apply(null, ps.map(x => x.liqUsd)) || 1;
  const sum = ps.reduce((a, x) => a + x.liqUsd, 0);
  return '<div class="card-h" style="margin-top:16px">Thanh khoản từng pool · ' + ps.length + ' pool lớn nhất</div>' +
    '<div class="pbar">' + ps.map(x =>
      '<div class="pbar-row"><span class="k" title="' + esc((x.address || '') + ' · ' + (x.exchange || '')) + '">' +
        esc(String(x.exchange || x.address || '—').slice(0, 16)) + '</span>' +
      '<span class="pbar-track"><i style="width:' + Math.max(2, Math.round(x.liqUsd / mx * 100)) + '%"></i></span>' +
      '<span class="v">' + usd(x.liqUsd) + '</span></div>').join('') + '</div>' +
    '<p class="caveat">Thanh dài hơn là thanh khoản dày hơn — <b>không</b> có nghĩa là an toàn hơn. ' +
    'Pool lớn nhất chiếm ' + nf((ps[0].liqUsd / sum) * 100, 1) + '% trong ' + usd(sum) +
    ' của nhóm này. Dùng <span class="mono">--chart-a</span> để tách khỏi thang rủi ro.</p>';
}
function sparkPath(h, get, X, Y){
  let d = '', pen = false;
  h.forEach((p, j) => {
    const v = get(p);
    if (typeof v !== 'number' || isNaN(v)){ pen = false; return; }
    d += (pen ? 'L' : 'M') + X(j).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
    pen = true;
  });
  return d;
}
function holderLines(hist){
  const h = (hist || []).filter(p => p);
  if (h.length < 2) return '';
  const W = 560, H = 150, L = 46, R = 12, T = 14, B = 24, iw = W - L - R, ih = H - T - B;
  const ser = [];
  if (h.filter(p => typeof p.holders === 'number').length >= 2)
    ser.push({ n:'Holder', c:'var(--chart-a)', g: p => p.holders, f: v => nf(v) });
  if (h.filter(p => typeof p.liquidityUsd === 'number').length >= 2)
    ser.push({ n:'Thanh khoản USD', c:'var(--chart-b)', g: p => p.liquidityUsd, f: v => usd(v) });
  if (!ser.length) return '';
  const X = j => L + (h.length === 1 ? iw / 2 : (j / (h.length - 1)) * iw);
  let body = '', lg = '';
  ser.forEach(sr => {
    const vs = h.map(sr.g).filter(v => typeof v === 'number');
    const lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    const Y = v => T + ih - ((v - lo) / ((hi - lo) || 1)) * ih;
    body += '<path d="' + sparkPath(h, sr.g, X, Y) + '" fill="none" stroke="' + sr.c + '" stroke-width="2" stroke-linejoin="round"/>' +
      h.map((p, j) => typeof sr.g(p) === 'number'
        ? '<circle cx="' + X(j).toFixed(1) + '" cy="' + Y(sr.g(p)).toFixed(1) + '" r="2.6" fill="' + sr.c + '"/>' : '').join('');
    lg += '<span><i style="background:' + sr.c + '"></i>' + sr.n + ' · ' + sr.f(lo) + ' → ' + sr.f(hi) + '</span>';
  });
  return '<div class="hlines"><div class="card-h">Holder và thanh khoản qua ' + h.length + ' lần quét</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Holder và thanh khoản theo thời gian">' +
    '<line x1="' + L + '" y1="' + (T + ih) + '" x2="' + (W - R) + '" y2="' + (T + ih) + '" stroke="currentColor" opacity=".22"/>' +
    body + '</svg><div class="legend">' + lg + '</div>' +
    '<p class="caveat">Mỗi đường có <b>thang riêng</b> để nhìn ra xu hướng, nên đừng so độ dốc của hai đường với nhau.</p></div>';
}

        '. Mỗi ví có số dư, phần trăm tổng cung, USD đã mua/bán, lãi/lỗ đã thực hiện và nguồn cấp vốn.</p>' +
      evTable([{t:'#'},{t:'Ví'},{t:'% cung',r:1},{t:'Số dư',r:1},{t:'Đã mua',r:1},{t:'Đã bán',r:1},{t:'Lãi/lỗ',r:1},{t:'Nguồn vốn'},{t:'Nhãn'}], rows) +
      '</div>');
  } else {
    out.push('<div class="ev-sec"><h3>B · Danh sách holder top</h3>' +
      '<div class="gate"><b>Chưa lấy được bảng holder.</b> ' +
      '<span class="addr">dex/holders/list</span> là POST và bộ ẩn danh của CMC chặn nó — đã thử ' +
      ((hm.tried || []).length || 4) + ' dạng tham số, tất cả trả <span class="addr">' + (hm.status || 400) + '</span>. ' +
      'Cắm key CMC Pro là bảng này hiện đủ: địa chỉ ví, % tổng cung, số dư, USD đã mua/bán, lãi/lỗ đã thực hiện, ' +
      'nguồn cấp vốn, nhãn và 4 cờ rủi ro (blacklist · meme-pump · thanh khoản mỏng · mức rủi ro).</div>' +
      '<p class="sub" style="margin-top:10px">Số liệu đang có: ' + nf(be.holders || t.holders || 0) + ' holder' +
        (be.holders_per_mcap_m ? ' · ' + nf(be.holders_per_mcap_m, 1) + ' holder mỗi triệu USD vốn hoá' : '') +
        (be.dilution ? ' · tổng cung gấp ' + nf(be.dilution, 2) + ' lần cung lưu hành' : '') + '</p></div></div>');
  }

  /* ---------- E · ví lớn + lệnh thô ---------- */
  const w = v.whale, rows = (w && w.rows) || [];
  if (rows.length){
    const wsp = (w.wallets || []).slice(0, 10).map(d =>
      '<tr><td>' + addrHTML(d.wallet, acctURL(t.chain, d.wallet)) + '</td>' +
      '<td class="n">' + usdExact(d.buyUsd) + '</td>' +
      '<td class="n">' + usdExact(d.sellUsd) + '</td>' +
      '<td class="n">' + signed(d.buyUsd - d.sellUsd) + '</td>' +
      '<td class="n">' + d.txs + '</td>' +
      '<td>' + (d.bundle ? '<span class="warn">bundle/bot</span>' : '—') + '</td>' +
      '<td class="n">' + tsShort(d.lastTs) + '</td></tr>');
    const sw = rows.slice(0, 15).map(r =>
      '<tr><td class="n">' + tsShort(r.ts) + '</td>' +
      '<td>' + addrHTML(r.wallet, acctURL(t.chain, r.wallet)) + '</td>' +
      '<td class="' + (r.side === 'sell' ? 'side-sell' : 'side-buy') + '">' + (r.side === 'sell' ? 'bán' : 'mua') + '</td>' +
      '<td class="n">' + usdExact(r.usd) + '</td>' +
      '<td class="n">' + (r.amount === null || r.amount === undefined ? '—' : nf(r.amount, 2)) + '</td>' +
      '<td>' + esc(r.exchange || '—') + '</td>' +
      '<td>' + (r.bundle ? '<span class="warn">bundle</span>' : '—') + '</td>' +
      '<td>' + addrHTML(r.tx, txURL(t.chain, r.tx)) + '</td></tr>');
    out.push('<div class="ev-sec"><h3>' + v.dims.E.score + '/' + v.dims.E.max +
      ' · E · ' + (w.wallets || []).length + ' ví trong mẫu ' + (w.sampled || rows.length) + ' lệnh' +
      (w.windowMinutes ? ' (' + Math.round(w.windowMinutes) + ' phút gần nhất)' : '') + '</h3>' +
      '<div class="note-box warn" style="margin-bottom:12px"><span class="ic">!</span><div>' +
      '<b>Đây là mẫu, không phải tổng 24h.</b> Endpoint chỉ trả ~20 lệnh mỗi trang, hệ thống lấy ' +
      (v.window ? v.window.swapPages : 1) + ' trang. Cửa sổ thời gian thực tế của mẫu là ' +
      (w.windowMinutes ? Math.round(w.windowMinutes) + ' phút' : 'chưa xác định') +
      ' — không được đọc như số liệu cả ngày.</div></div>' +
      evTable([{t:'Ví'},{t:'Đã mua',r:1},{t:'Đã bán',r:1},{t:'Ròng',r:1},{t:'Lệnh',r:1},{t:'Dấu hiệu'},{t:'Lần cuối',r:1}], wsp) +
      '<p class="sub" style="margin-top:16px">Lệnh thô gần nhất — mỗi dòng có mã giao dịch mở được trên explorer:</p>' +
      evTable([{t:'Thời điểm',r:1},{t:'Ví'},{t:'Chiều'},{t:'Giá trị USD',r:1},{t:'Số token',r:1},{t:'Sàn'},{t:'Dấu hiệu'},{t:'Mã giao dịch'}], sw) +
      flowChart(rows) + '</div>');
  }

  if (!out.length) return '';
  return '<div class="card pad"><div class="card-h">Bằng chứng · số liệu tra được cho từng kết luận</div>' +
    '<p class="caveat" style="margin-bottom:14px">Mọi con số dưới đây đến từ dữ liệu CMC trả về trong lần quét này. ' +
    'Địa chỉ ví, pool và mã giao dịch đều mở được trên explorer để bạn tự kiểm chứng. ' +
    'Chỗ nào chưa lấy được thì nói rõ chưa lấy được, không suy diễn.</p>' +
    out.join('') + '</div>';
}

function viewResult(chain, addr){
  const key = keyOf(chain, addr);
  const v = applyMode(key, State.mode);
  if (!v) {
    return '<div class="page-h"><h1>Không có kết quả cho token này</h1></div>' +
      '<div class="empty"><h3>Chưa quét token này</h3>' +

  }
  const t = v.token;

  const _evh = location.hash.match(/^#\/ev\/([A-Za-z]+):?\/?([^\/]*)$/);
  if (_evh && _evh[1]) setTimeout(() => showEv(_evh[1], applyMode(State.evKey, State.mode)), 80);
  const inWatch = State.watch.some(w => w.key === v.key);
  const lowCoverage = v.coverage < 50;

  /* thẻ kết luận — hoặc thay hẳn khi độ phủ dưới 50% (trạng thái 5) */
  let verdictCard;
  if (lowCoverage) {
    verdictCard = '<div class="verdict none"><div class="v-top" style="align-items:flex-start">' +

      coverageBlock(v) + '</div>' +
      '<div class="v-reasons"><div class="row"><span class="k">Lấy được</span><span class="lead"></span>' +
      '<span class="v">' + DIM_ORDER.filter(k => v.dims[k].applicable).map(k => k + ' · ' + v.dims[k].label).join(', ') + '</span></div>' +
      '<div class="row"><span class="k">Không lấy được</span><span class="lead"></span>' +
      '<span class="v">' + (DIM_ORDER.filter(k => !v.dims[k].applicable).map(k => k + ' · ' + v.dims[k].label).join(', ') || '—') + '</span></div>' +
      '<div class="row"><span class="k">Đã thử</span><span class="lead"></span>' +
      '<span class="v">' + v.calls.length + ' lời gọi · ' + v.calls.filter(c => c.status >= 400).length + ' lỗi</span></div>' +
      '</div></div>';
  } else {
    const L = LEVELS[v.level];
    verdictCard = '<div class="verdict ' + L.cls + '"><div class="v-top">' +
      '<div><div class="v-lvl ' + L.cls + '">' + L.vn + '</div>' +
      '<div class="v-score" data-ev="score" style="cursor:pointer" title="Bấm xem dẫn chứng của từng chiều">' + v.score + '</div>' + radarSVG(v.dims) + '</div>' +
      coverageBlock(v) + '</div>' +
      '<div class="v-reasons">' +
      (v.reasons.length
        ? v.reasons.map((r,i) => {
            const neg = r.value < 0;
            return '<div class="reason' + (neg ? ' neg' : '') + '"><span class="n">' + (i+1) + '</span>' +
              '<span class="t">' + esc(r.text) +
              '<span class="src">' + r.dim + ' · ' + esc(v.dims[r.dim].endpoint) + '</span></span>' +
              '<span class="v">' + signed(r.value) + ' / ' + r.max + '</span></div>';
          }).join('')
        : '<div class="reason"><span class="t">Chưa có lý do nào vượt ngưỡng đáng kể.</span></div>') +
      '</div></div>';
  }

  /* trạng thái 4 và 6 */
  const missing = DIM_ORDER.filter(k => !v.dims[k].applicable);

    notices.push('<div class="note-box"><span class="ic">i</span><div>' +

      '<b>Đang dùng dữ liệu mẫu.</b> Số liệu là bản chụp lúc ' + dtime(v.fetchedAt) +
      ', không phải dữ liệu sống.</div></div>');

  return '<div class="page-h">' +
      '<div><div class="crumb"><a href="#/">Quét</a><span>/</span><span>' + esc(CHAINS[t.chain] || t.chain) +
        '</span><span>/</span><span>' + esc(shortAddr(t.address)) + '</span></div>' +
      '<h1>' + esc(t.symbol) + ' <span style="color:var(--faint);font-weight:400">· ' +
        esc(CHAINS[t.chain] || t.chain) + '</span></h1>' +
      '<div class="sub num">' + esc(t.name) + ' · ' +
        '<span data-ev="market" style="cursor:pointer;text-decoration:underline dotted" title="Bấm xem dẫn chứng">' + price(t.priceUsd) + '</span> · thanh khoản ' +
        '<span data-ev="liq" style="cursor:pointer;text-decoration:underline dotted" title="Bấm xem dẫn chứng">' + usd(t.liquidityUsd) + '</span> · ' +
        '<span data-ev="holders" style="cursor:pointer;text-decoration:underline dotted" title="Bấm xem dẫn chứng">' + nf(t.holders) + ' holder</span></div>' + cmcChipHTML(v) + '</div>' +
      '<div class="right"><span class="badge ' + MODES[State.mode].cls + '">' +
        (State.mode === 'full' ? ('đầy đủ · ' + v.scored + '/5 chiều chấm được') : MODES[State.mode].badge) + '</span></div>' +
    '</div>' +
    '<p class="caveat" style="margin:8px 0 0"><b>Bấm vào con số nào cũng mở được hộp dẫn chứng</b> — endpoint nào, mã HTTP bao nhiêu, ' +
      'dữ liệu thô ra sao; chỗ nào CMC không trả được thì nói thẳng là không.</p>' +
    '<div class="src-attrib"><span>Dữ liệu: CoinMarketCap API</span>' +
      '<span data-ev="calls" style="cursor:pointer;text-decoration:underline dotted" title="Bấm xem từng lời gọi CMC">' + v.calls.length + ' lời gọi</span><span>cập nhật ' + ago(v.fetchedAt) + '</span>' +
      '<span>chế độ ' + MODES[State.mode].vn.toLowerCase() + '</span></div>' +
    '<div class="cols two"><div class="stack sticky">' + verdictCard + notices.join('') + '</div>' +
      '<div class="stack">' + contactHTML(v) + tokenMarketHTML(v) + whaleHTML(v.whale) +
        '<div class="card pad"><div class="card-h">5 chiều chấm điểm</div>' +
          DIM_ORDER.map(k => meterHTML(k, v.dims[k])).join('') +
          '<div class="row" style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">' +
            '<span class="k">Tổng điểm thô</span><span class="lead"></span>' +
            '<span class="v">' + v.scoreRaw + ' / ' + v.scoreMax + '</span></div>' +
          '<div class="row"><span class="k">Quy về thang 100</span><span class="lead"></span>' +
            '<span class="v">' + v.score + '</span></div>' +
        '</div>' +
        historyBlock(v) + priceCard(v) + logHTML(v.calls) +
      '</div></div>' +
    '<div class="stack" style="margin-top:28px">' + evidenceHTML(v) + '</div>' +
    actionsHTML(v, inWatch);
}
/* ==========================================================================
   HỘP DẪN CHỨNG — bấm vào bất kỳ con số nào để mở danh sách đứng sau nó

function evClose(){
  const el = document.getElementById('evModal');
  if (el) el.remove();
  _evOpen = false;
  document.body.style.overflow = '';
}
let _evOpen = false;
function evOpen(title, sub, bodyHTML, foot, after){
  evClose();
  _evOpen = true;
  document.body.style.overflow = 'hidden';
  const wrap = document.createElement('div');
  wrap.id = 'evModal';
  wrap.setAttribute('role', 'dialog');
  wrap.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(8,10,16,.74);' +
    'display:flex;align-items:flex-start;justify-content:center;padding:3vh 8px;overflow:auto';
  wrap.innerHTML = '<div style="width:100%;max-width:min(1000px,100%);min-width:0;box-sizing:border-box;background:var(--surface,#151922);' +
    'border:1px solid var(--border,#2b3140);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55)">' +
    '<div style="display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--border,#2b3140)">' +
    '<div style="flex:1"><div style="font-size:var(--t-md);font-weight:600">' + esc(title) + '</div>' +
    (sub ? '<div style="color:var(--muted);font-size:var(--t-sm);margin-top:5px">' + sub + '</div>' : '') + '</div>' +
    '<button class="btn sm ghost" type="button" id="evX">Đóng</button></div>' +
    '<div style="padding:14px 14px;max-width:100%;min-width:0;box-sizing:border-box;overflow-x:auto;word-break:break-word">' + bodyHTML + '</div>' +
    (foot ? '<div style="padding:12px 18px;border-top:1px solid var(--border,#2b3140);color:var(--muted);' +
      'font-size:var(--t-xs)">' + foot + '</div>' : '') + '</div>';
  document.body.appendChild(wrap);
  const x = document.getElementById('evX'); if (x) x.onclick = evClose;
  wrap.addEventListener('click', ev => { if (ev.target === wrap) evClose(); });
  if (after) after();
}
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && _evOpen) evClose(); });
function evRow(k, val){ return '<div class="row"><span class="k">' + k + '</span><span class="lead"></span>' +
  '<span class="v">' + val + '</span></div>'; }
function evNum(x, d){ return (x === null || x === undefined || isNaN(x)) ? '—' : nf(x, d === undefined ? 2 : d); }
function evRaw(o){
  return '<details style="margin-top:14px"><summary style="cursor:pointer;color:var(--muted);font-size:var(--t-sm)">' +
    'Dữ liệu thô (JSON đầy đủ)</summary><pre style="max-height:340px;overflow:auto;background:var(--bg,#0d1017);' +
    'border:1px solid var(--border,#2b3140);border-radius:10px;padding:10px;font-size:var(--t-xs);' +
    'white-space:pre-wrap;word-break:break-word">' + esc(JSON.stringify(o, null, 1)) + '</pre></details>';
}
function evSrc(o){
  if (!o) return '';
  return evRow('Endpoint', '<span class="mono">' + esc(String(o.endpoint || '')) + '</span>') +
    evRow('Mã HTTP', '<span class="mono">' + esc(String(o.status === undefined ? '—' : o.status)) + '</span>' +
      (o.ms ? ' · ' + o.ms + ' ms' : '')) +
    (o.error ? evRow('CMC trả lỗi', '<span class="mono">' + esc(String(o.error)) + '</span>') : '');
}
function evCells(list, max){
  const EV_LABEL = { body:'Thân phản hồi', status:'Mã HTTP', error:'Lỗi', path:'Đường dẫn CMC', ms:'Thời gian (ms)', side:'Chiều', usd:'Giá trị (USD)', count:'Số lượng', platform:'Chuỗi', platformId:'Mã nền tảng', tokenAddress:'Địa chỉ token', address:'Địa chỉ', ts:'Thời điểm', share:'Tỷ trọng', wallet:'Ví', sym:'Ký hiệu', rank:'Hạng' };
  const EV_INT = /^(status|ms|count|rank)$/;

  list = (list || []).filter(x => x && typeof x === 'object').slice(0, max || 40);
  if (!list.length) return '';
  const keys = [];
  list.forEach(o => Object.keys(o).forEach(k => { if (keys.indexOf(k) < 0 && keys.length < 9) keys.push(k); }));
  const head = keys.map(k => ({ t: EV_LABEL[k] || k }));
  const rows = list.map(o => '<tr>' + keys.map(k => {
    let x = o[k];
    if (x === null || x === undefined || x === '') return '<td>—</td>';
    if (typeof x === 'object') x = JSON.stringify(x);
    const s = String(x);
    if (/^https?:\/\//.test(s)) return '<td><a href="' + esc(s) + '" target="_blank" rel="noopener">xem</a></td>';
    if (typeof x === 'number') return '<td class="n">' + (EV_INT.test(k) ? nf(x, 0) : nf(x, Math.abs(x) < 10 ? 4 : 2)) + '</td>';
    if (/^[0-9a-fA-Fx]{18,}$/.test(s)) return '<td class="mono" title="' + esc(s) + '">' + esc(s.slice(0, 8)) + '…' + esc(s.slice(-6)) + '</td>';
    return '<td>' + esc(s.length > 22 ? s.slice(0, 22) + '…' : s) + '</td>';
  }).join('') + '</tr>');
  return evTable(head, rows) + '<p class="caveat">' + list.length + ' dòng — bảng hiện mọi trường CMC trả về, không lọc bớt.</p>';
}
function evPools(v){

      evRow('Tổng cộng các pool', pr.totals.poolsSum === null ? '—' : usd(pr.totals.poolsSum)) +
      evRow('Số pool', evNum(pr.totals.poolsCount, 0)) +

   ========================================================================== */
function chartSVG(hist){
  const W = 560, H = 190, L = 36, R = 12, T = 14, B = 30;
  const iw = W - L - R, ih = H - T - B;
  const ys = hist.map(p => p.score);
  let lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  if (hi - lo < 10){ lo -= 5; hi += 5; }
  lo = Math.max(0, Math.floor(lo - 2)); hi = Math.min(100, Math.ceil(hi + 2));
  if (hi <= lo) hi = lo + 10;
  const X = i => L + (hist.length === 1 ? iw/2 : (i/(hist.length-1))*iw);
  const Y = v => T + ih - ((v - lo)/(hi - lo))*ih;
  const line = hist.map((p,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.score).toFixed(1)).join(' ');
  const area = line + ' L' + X(hist.length-1).toFixed(1) + ' ' + (T+ih) + ' L' + X(0).toFixed(1) + ' ' + (T+ih) + ' Z';
  const grid = [lo, Math.round((lo+hi)/2), hi].map(v =>
    '<line class="grid" x1="' + L + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W-R) + '" y2="' + Y(v).toFixed(1) + '"/>' +
    '<text class="axis" x="' + (L-7) + '" y="' + (Y(v)+3.5).toFixed(1) + '" text-anchor="end">' + v + '</text>').join('');
  const pts = hist.map((p,i) => '<circle class="pt" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.score).toFixed(1) + '" r="3.5"/>').join('');
  const labs = hist.map((p,i) => {
    if (hist.length > 6 && i % 2) return '';
    return '<text class="axis" x="' + X(i).toFixed(1) + '" y="' + (H-10) + '" text-anchor="middle">' + dtime(p.at).split(' ')[0] + '</text>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
    'aria-label="Biểu đồ điểm rủi ro theo thời gian">' +
    grid + '<path class="area" d="' + area + '"/><path class="line" d="' + line + '"/>' +
    pts + labs + '</svg>';
}

function toast(msg, kind, sub){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'info');
  el.innerHTML = '<span class="ic">' + (kind === 'ok' ? '✓' : kind === 'err' ? '✕' : 'i') + '</span>' +
    '<div>' + esc(msg) + (sub ? '<div class="field-help" style="margin-top:2px">' + esc(sub) + '</div>' : '') + '</div>' +
    '<button class="x" aria-label="Đóng">✕</button>';
  el.querySelector('.x').onclick = () => el.remove();
  toasts.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}
function confirmModal(o){
  modalHost.innerHTML =
    '<div class="backdrop" id="bd"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">' +
    '<h3 id="mt">' + esc(o.title) + '</h3><p>' + o.body + '</p>' +
    '<div class="acts"><button class="btn ghost" id="mNo" type="button">Huỷ</button>' +
    '<button class="btn ' + (o.danger ? 'danger' : 'pri') + '" id="mYes" type="button">' + esc(o.ok) + '</button></div>' +
    '</div></div>';
  const close = () => { modalHost.innerHTML = ''; };
  document.getElementById('mNo').onclick = close;
  document.getElementById('bd').onclick = e => { if (e.target.id === 'bd') close(); };
  document.getElementById('mYes').onclick = () => { close(); o.onOk(); };
  document.getElementById('mNo').focus();
  document.addEventListener('keydown', function esc_(e){
    if (e.key === 'Escape'){ close(); document.removeEventListener('keydown', esc_); }
  });
}

}

/* ==========================================================================
   ĐIỀU PHỐI
   ========================================================================== */
const $ = id => document.getElementById(id);
const nav = $('nav'), bottombar = $('bottombar'), modeBadge = $('modeBadge'),
      themeBtn = $('themeBtn'), toasts = $('toasts'), modalHost = $('modalHost'), main = $('main');

State.themePref = Store.get('er.themePref', 'dark');

/* ---------- định tuyến ---------- */
function parseRoute(){
  const h = (location.hash || '#/').replace(/^#/, '');
  return h.split('/').filter(Boolean);
}
function routePath(){ const p = parseRoute(); return '#/' + p.join('/'); }

const SCAN_STEPS = 5;
let scanTimer = null, rlTimer = null;

function stopTimers(){ clearInterval(scanTimer); clearInterval(rlTimer); scanTimer = rlTimer = null; }

function scanPhases(key){
  const raw = rawOf(key);
  const sym = raw ? raw.token.symbol : key.split(':')[1].slice(0, 7);
  State.landing = 'scanning'; State.scanStep = 1; State.scanLabel = sym;
  render();
  const timer = setInterval(() => {
    if (State.scanStep < SCAN_STEPS - 1){
      State.scanStep++;
      const host = $('scanSteps');
      if (host) host.innerHTML = scanStepsHTML(State.scanStep);
    }
  }, 380);
  return timer;
}
function finishScan(key){
  State.landing = 'idle'; State.query = '';
  location.hash = '#/scan/' + key.replace(':', '/');
}
function startScan(key){
  stopTimers();
  if (State.mode === 'offline' || !API.online()){
    scanTimer = scanPhases(key);
    setTimeout(() => { clearInterval(scanTimer); scanTimer = null; finishScan(key); }, 1500);
    return;
  }
  scanTimer = scanPhases(key);
  const parts = key.split(':');
  API.scan(parts[0], parts.slice(1).join(':')).then(r => {
    clearInterval(scanTimer); scanTimer = null;
    const j = r.json;
    if (r.status === 0 || !j){
      State.landing = 'netdown'; render();
      toast('Không gọi được máy chủ dữ liệu.', 'err',
            'Chạy: python3 exit_radar_server.py — hoặc dùng chế độ dữ liệu mẫu.');
      return;
    }
    if (j.error === 'nopool'){ State.landing = 'nopool'; render(); return; }
    if (j.error === 'token'){
      if (j.status === 429 || /limit|429/i.test(String(j.detail || ''))){
        State.landing = 'ratelimit'; render(); startCountdown(key); return;
      }
      if (j.status === 404){ State.query = parts[1] || ''; State.landing = 'notfound'; render(); return; }
      State.landing = 'netdown'; render();
      toast('CMC trả lỗi ' + j.status, 'err', String(j.detail || '').slice(0, 120));
      return;
    }
    adopt(key, j);
    const scored = DIM_ORDER.filter(k => j.dims[k] && j.dims[k].applicable).length;
    toast('Quét xong bằng dữ liệu thật từ CMC.', 'ok',
          j.calls.length + ' lời gọi · ' + scored + '/5 chiều · ' + (j.elapsedMs || 0) + 'ms');
    finishScan(key);
  });
}
function startCountdown(key){
  stopTimers();
  State.rateLeft = 12;
  rlTimer = setInterval(() => {
    State.rateLeft--;
    const el = $('rlCount');
    if (el) el.textContent = State.rateLeft;
    if (State.rateLeft <= 0){
      clearInterval(rlTimer); rlTimer = null;
      toast('Giới hạn API đã hết, quét tiếp.', 'ok');
      startScan(key);
    }
  }, 1000);
}

function resolveQuery(q){
  const low = q.trim().toLowerCase();
  if (!low) return { state:'idle' };
  if (low === 'zzz' || low === 'khongco') return { state:'notfound' };
  if (low === '429') return { state:'ratelimit' };
  if (low === 'new') return { state:'nopool' };
  if (low === 'offline') return { state:'netdown' };
  const hits = searchIndex(low);
  if (!hits.length) return { state:'notfound' };
  if (hits.length === 1) return { state:'go', key:hits[0].key };
  return { state:'ambiguous', list:hits.slice(0,6) };
}
function runScan(q){
  State.query = q;
  State.searchErr = null;
  const t = q.trim();
  // {2,} chu khong phai {4,}: ky hieu 3 chu nhu WIF truoc day khong bao gio
  // duoc hoi may chu, chi tra trong chi muc cuc bo 5 token mau.
  if (API.online() && t.length >= 2 && /^[A-Za-z0-9]{2,}$/.test(t) && !/^(429|new|offline|zzz)$/i.test(t)){
    State.landing = 'scanning'; State.scanStep = 1; State.scanLabel = t.toUpperCase(); render();
    API.search(t).then(js => {
      if (!js || !js.ok || !js.items || !js.items.length){
        const r = resolveQuery(q);
        if (r.state === 'go'){ startScan(r.key); return; }
        // Truoc day moi truong hop that bai deu hien "khong tim thay token" —
        // sai khi nguyen nhan la het han muc hoac khong goi duoc may chu.
        State.searchErr = !js ? 'Không gọi được máy chủ dữ liệu.'
          : (js.status === 429 || js.status === 403) ? 'Hạn mức API của CMC đã hết (mã ' + js.status + ').'
          : (js.status >= 500) ? 'Máy chủ dữ liệu trả lỗi ' + js.status + '.'
          : null;
        State.landing = (js && (js.status === 429 || js.status === 403)) ? 'ratelimit' : 'notfound'; render();
        if (State.landing === 'ratelimit') startCountdown('solana:DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263');
        return;
      }
      State.ambiguous = js.items.map(x => ({ key: keyOf(x.chain, x.address), chain: x.chain,
        address: x.address, symbol: x.symbol, name: x.name,
        liquidityUsd: x.liquidityUsd || 0, holders: x.holders || 0 }));
      if (State.ambiguous.length === 1) startScan(State.ambiguous[0].key);
      else { State.landing = 'ambiguous'; render(); }
    });
    return;
  }
  const r = resolveQuery(q);
  if (!API.online()) State.searchErr = 'Chưa kết nối được máy chủ dữ liệu nên chỉ tra được chỉ mục cục bộ.';
  if (r.state === 'go'){ startScan(r.key); return; }
  if (r.state === 'ambiguous'){
    State.ambiguous = r.list.sort((a,b) => b.liquidityUsd - a.liquidityUsd);
    State.landing = 'ambiguous'; render(); return;
  }
  if (r.state === 'ratelimit'){
    State.landing = 'ratelimit'; render();
    startCountdown('solana:DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263'); return;
  }
  State.landing = r.state === 'idle' ? 'idle' : r.state;
  render();
}

/* ---------- vẽ ---------- */
function render(){
  stopTimers();
  const p = parseRoute();
  renderNav('#/' + p.join('/'));
  applyTheme();

  if (p.length === 0) main.innerHTML = viewLanding();
  else if (p[0] === 'scan' && p.length >= 3) main.innerHTML = viewResult(p[1], p.slice(2).join('/'));
  else if (p[0] === 'watchlist' && p.length >= 3) main.innerHTML = viewHistory(p[1] + ':' + p.slice(2).join('/'));
  else if (p[0] === 'watchlist') main.innerHTML = viewWatchlist();
  else if (p[0] === 'settings') main.innerHTML = viewSettings();
  else if (p[0] === 'method') main.innerHTML = viewMethod();
  else if (p[0] === 'evidence') main.innerHTML = viewEvidence();
  else if (p[0] === 'about') main.innerHTML = viewAbout();
  else main.innerHTML = viewLanding();

  bind(p);
  paint();
}

/* ---------- gắn sự kiện theo màn ---------- */
function bind(p){
  /* --- màn quét --- */
  const form = $('searchForm');
  if (form){
    form.addEventListener('submit', e => { e.preventDefault(); runScan($('q').value); });
    const q = $('q');
    if (q){
      if (document.activeElement !== q) q.focus();
      let deb = null;
      q.addEventListener('input', () => {
        const v = q.value;
        State.query = v;
        if (API.online()){
          clearTimeout(deb);
          deb = setTimeout(() => {
            API.search(v).then(js => {
              if (!js || !js.ok || !js.items || !js.items.length) return;
              State.ambiguous = js.items.map(x => ({ key: keyOf(x.chain, x.address), chain: x.chain,
                address: x.address, symbol: x.symbol, name: x.name,

/* ==========================================================================
   TƯƠNG TÁC BỔ SUNG — sao chép địa chỉ, hover/bàn phím cho mốc mở hộp dẫn
   chứng, đưa thanh nút lên đầu, lọc + sắp xếp cho mọi bảng và danh sách.

function stripVN(x){
  return String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').toLowerCase();
}
function copyText(t){
  const done = () => toast('Đã sao chép ' + (t.length > 20 ? t.slice(0, 8) + '…' + t.slice(-6) : t), 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(fb);
  } else { fb(); }
  function fb(){
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:absolute;left:-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast('Không sao chép được — hãy chọn rồi sao chép thủ công', 'err'); }
    ta.remove();
  }
}
document.addEventListener('click', ev => {
  const c = ev.target.closest ? ev.target.closest('[data-copy]') : null;
  if (!c) return;
  ev.preventDefault(); ev.stopPropagation();
  copyText(c.getAttribute('data-copy') || '');
}, true);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const el = ev.target.closest ? ev.target.closest('[data-ev]') : null;
  if (!el || ev.target.tagName === 'BUTTON' || ev.target.tagName === 'A') return;
  ev.preventDefault(); el.click();
});
function enhanceTables(root){
  (root || document).querySelectorAll('table.ev-table').forEach(tb => {
    if (tb.getAttribute('data-enh')) return;
    tb.setAttribute('data-enh', '1');
    const box = tb.closest('.ev-wrap') || tb.parentNode;
    const bar = document.createElement('div');
    bar.className = 'tbl-bar';
    bar.innerHTML = '<input type="search" placeholder="Lọc trong bảng…" aria-label="Lọc trong bảng">' +
      '<span class="hint">Bấm tiêu đề cột để sắp xếp</span>';
    box.parentNode.insertBefore(bar, box);
    const inp = bar.querySelector('input');
    inp.addEventListener('input', () => {
      const q = stripVN(inp.value);
      tb.querySelectorAll('tbody tr').forEach(tr => {
        tr.style.display = (!q || stripVN(tr.textContent).indexOf(q) >= 0) ? '' : 'none';
      });
    });
    const num = x => {
      const m = String(x).replace(/\u2212/g, '-').replace(/[^0-9.,\-]/g, '').replace(/\./g, '').replace(',', '.');
      const v = parseFloat(m); return isNaN(v) ? null : v;
    };
    tb.querySelectorAll('thead th').forEach((th, ci) => {
      th.classList.add('sortable');
      th.addEventListener('click', () => {
        const body = tb.querySelector('tbody');
        const rows = Array.prototype.slice.call(body.querySelectorAll('tr'));
        const dir = th.getAttribute('data-dir') === 'asc' ? 'desc' : 'asc';
        tb.querySelectorAll('thead th').forEach(o => o.removeAttribute('data-dir'));
        th.setAttribute('data-dir', dir);
        rows.sort((a, b) => {
          const A = a.children[ci] ? a.children[ci].textContent.trim() : '';
          const B = b.children[ci] ? b.children[ci].textContent.trim() : '';
          const an = num(A), bn = num(B);
          const c = (an !== null && bn !== null) ? (an - bn) : stripVN(A).localeCompare(stripVN(B));
          return dir === 'asc' ? c : -c;
        });
        rows.forEach(r => body.appendChild(r));
      });
    });
  });
}

function priceChart(pts, endpoint, status){

  const X = i => L + (i / (ps.length - 1)) * iw;

  const line = ps.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.price).toFixed(1)).join(' ');
  const area = line + ' L' + X(ps.length - 1).toFixed(1) + ' ' + (T + ih) + ' L' + L + ' ' + (T + ih) + ' Z';
  const up = ps[ps.length - 1].price >= ps[0].price, col = up ? 'var(--buy)' : 'var(--sell)';
  const grid = [hi, (lo + hi) / 2, lo].map(v => '<line x1="' + L + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - R) +
    '" y2="' + Y(v).toFixed(1) + '" stroke="currentColor" opacity=".13"/>' +

  const f = d => d.getDate() + '/' + (d.getMonth() + 1);
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Biểu đồ giá theo ngày">' +
    grid + '<path d="' + area + '" fill="' + col + '" opacity=".12"/>' +
    '<path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2"/>' + dots +
    '<text x="' + L + '" y="' + (H - 8) + '" font-size="9.5" fill="currentColor" opacity=".6">' + f(new Date(ps[0].t)) + '</text>' +
    '<text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end" font-size="9.5" fill="currentColor" opacity=".6">' +
    f(new Date(ps[ps.length - 1].t)) + '</text></svg>' +
    chartLegend([{ c: col, t: (up ? 'tăng' : 'giảm') + ' trong kỳ' },
      { c: 'var(--muted)', t: 'đầu kỳ', v: price(ps[0].price) },
      { c: 'var(--muted)', t: 'cuối kỳ', v: price(ps[ps.length - 1].price) }]) +

function evaluateRules(){
  State._snap = State._snap || {};
  State.watch.forEach(w => {
    const live = liveOf(w);
    const snap = State._snap[w.key];
    const r = w.rules || {};
    const rules = WL_RULES.filter(x => x.k !== 'whaleOut' ? (r[x.k] != null) : !!r[x.k]);
    if (!snap){ State._snap[w.key] = live; return; }
    if (!rules.length){ State._snap[w.key] = live; return; }
    const fired = [];
    const push = (label, from, to) => fired.push({
      key:w.key, symbol:w.symbol, at:new Date().toISOString(), rule:label,
      text:label + ' (' + from + ' → ' + to + ')', from:from, to:to
    });
    if (r.scoreAbove != null && snap.score < r.scoreAbove && live.score >= r.scoreAbove)
      push('điểm vượt ' + nf(r.scoreAbove, 0), nf(snap.score, 0), nf(live.score, 0));
    if (r.jumpUp != null && (live.score - snap.score) >= r.jumpUp)
      push('điểm tăng ≥ ' + nf(r.jumpUp, 0), nf(snap.score, 0), nf(live.score, 0));
    if (r.liqDropPct != null && snap.liq && live.liq)
      if ((live.liq - snap.liq) / Math.abs(snap.liq) * 100 <= -r.liqDropPct)
        push('thanh khoản giảm ≥ ' + nf(r.liqDropPct, 0) + '%', usd(snap.liq), usd(live.liq));
    if (r.holdDropPct != null && snap.holders && live.holders)
      if ((live.holders - snap.holders) / Math.abs(snap.holders) * 100 <= -r.holdDropPct)
        push('holder giảm ≥ ' + nf(r.holdDropPct, 0) + '%', nf(snap.holders), nf(live.holders));
    if (r.whaleOut && snap.whale !== 'out' && live.whale === 'out')
      push('dòng tiền ví lớn chuyển sang rút', snap.whale || 'không rõ', 'đang rút');
    if (fired.length){
      State.alerts = fired.concat(State.alerts).slice(0, 60);
      saveAlerts();
      fired.forEach(a => toast('⚠ ' + a.symbol + ': ' + a.text, 'err'));
    }
    State._snap[w.key] = live;
  });
}

      if (c) c.onclick = evClose;
      if (s) s.onclick = () => {
        const nr = {};
        TG_RULES.forEach(x => {
          if (x.u === 'bật/tắt'){ const el = document.getElementById('tg_' + x.k); if (el && el.checked) nr[x.k] = true; }
          else { const el = document.getElementById('tg_' + x.k); const v = el && el.value !== '' ? Number(el.value) : null; if (v != null && !isNaN(v)) nr[x.k] = v; }
        });
        if (Object.keys(nr).length) w.tg = nr; else delete w.tg;
        saveWatch(); render(); evClose();
        toast('Đã lưu luật bot cho ' + w.symbol, 'ok', Object.keys(nr).length ? 'Bấm “Đẩy danh sách & luật lên bot” để bot nhận luật mới.' : '');
      };
    });
}

  return i < 0 ? h + tgPanelHTML() : h.slice(0, i) + tgPanelHTML() + h.slice(i);
};
const _tgRow = window.wlRowHTML;

  return h.replace('<button class="btn sm ghost" data-rules=', '<button class="btn sm ghost" data-tg="' + esc(w.key) + '" type="button" title="Luật gửi qua Telegram">Bot</button>' +

const _tgSum = window.wlRuleSummary;
window.wlRuleSummary = function(w){
  let s = _tgSum.apply(this, arguments);
  const g = tgRuleChips(w);

  if (s.indexOf('chưa đặt') >= 0) s = '';

};

document.addEventListener('click', ev => {

  if (w) tgRulesModal(w);
}, true);

    clearTimeout(I18N_timer);

/* số · ngày · tiền theo ngôn ngữ, vẫn dùng hàm gốc khi ở tiếng Việt */
const I18N_RAW = { nf:window.nf, usd:window.usd, dtime:window.dtime, price:window.price, signed:window.signed, usdExact:window.usdExact };
function I18N_num(v, d){
  const n = Number(v);
  if (!isFinite(n)) return '—';
  try { return new Intl.NumberFormat(I18N_LOCALE[I18N_lang] || 'en-US',
    { minimumFractionDigits:d || 0, maximumFractionDigits:d || 0 }).format(n); }
  catch (e){ return String(v); }
}
function I18N_intl(){
  if (I18N_lang === 'vi') return;
  const M = { K:'K', M:'M', B:'B' };
  window.nf = function(v, d){ return I18N_num(v, d || 0); };
  window.usd = function(v){
    const n = Math.abs(Number(v) || 0);
    if (n >= 1e9) return '$' + I18N_num(n / 1e9, 2) + ' ' + M.B;
    if (n >= 1e6) return '$' + I18N_num(n / 1e6, 2) + ' ' + M.M;
    if (n >= 1e3) return '$' + I18N_num(n / 1e3, 1) + ' ' + M.K;
    return '$' + I18N_num(n, 2);
  };
  window.price = function(v){
    const n = Number(v) || 0;
    if (n && n < 0.01) return '$' + n.toExponential(3);
    return '$' + I18N_num(n, n < 1000 ? 2 : 0);
  };
  window.dtime = function(iso){
    try {
      const dt = new Date(iso);
      return new Intl.DateTimeFormat(I18N_LOCALE[I18N_lang], { day:'2-digit', month:'2-digit',
        hour:'2-digit', minute:'2-digit', hour12:false }).format(dt).replace(',', '');
    } catch (e){ return I18N_RAW.dtime(iso); }
  };
}
function I18N_unwrap(){
  window.nf = I18N_RAW.nf; window.usd = I18N_RAW.usd; window.dtime = I18N_RAW.dtime;
  window.price = I18N_RAW.price; window.signed = I18N_RAW.signed; window.usdExact = I18N_RAW.usdExact;
}

function I18N_langList(){

function I18N_switcher(){

  wrap.className = 'i18n-sw';
  if (document.getElementById('i18nMenu')){

    if (_b){ _b.textContent = cur.label; _b.title = cur.name; }
    try {
      const _btns = document.getElementById('i18nMenu').querySelectorAll('button[data-lang]');
      for (let _i = 0; _i < _btns.length; _i++)
        _btns[_i].setAttribute('aria-current', _btns[_i].getAttribute('data-lang') === I18N_lang ? 'true' : 'false');
    } catch (e) {}
  } else {
  wrap.style.cssText = 'position:relative;display:inline-flex;align-items:center';
  wrap.innerHTML =
    '<button type="button" id="i18nBtn" aria-haspopup="true" aria-expanded="false" title="' + cur.name +
      '" style="font:inherit;font-size:11px;letter-spacing:.04em;padding:4px 8px;border:1px solid var(--border);' +
      'background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;line-height:1.2">' + cur.label + '</button>' +
    '<div id="i18nMenu" hidden style="position:absolute;top:120%;right:0;z-index:60;min-width:170px;padding:6px;' +
      'background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)">' +
      LANGS.map(function(l){
        return '<button type="button" data-lang="' + l.k + '" style="display:flex;width:100%;gap:10px;' +
          'justify-content:space-between;font:inherit;font-size:12px;padding:6px 8px;border:0;border-radius:7px;' +
          'background:transparent;color:' + (l.k === I18N_lang ? 'var(--text)' : 'var(--muted)') +
          ';cursor:pointer;text-align:left"><span>' + l.name + '</span>' +
          '<span style="font-family:var(--mono);opacity:.7">' + l.label + '</span></button>';
      }).join('') +
      '<div style="border-top:1px solid var(--border);margin-top:5px;padding:6px 8px 2px;font-size:11px;color:var(--faint)">' +
        '<a href="#" id="i18nInfo" style="color:inherit;text-decoration:none">' + t('Chuỗi chưa dịch') + '</a></div>' +
    '</div>';
  }
  const btn = document.getElementById('i18nBtn'), menu = document.getElementById('i18nMenu');
  if (btn && menu) btn.addEventListener('click', function(ev){
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    btn.setAttribute('aria-expanded', String(!menu.hidden));
  });
  wrap.addEventListener('click', function(ev){
    const b = (ev.target && ev.target.closest) ? ev.target.closest('[data-lang]') : null;
    if (!b) return;
    const k = b.getAttribute('data-lang');
    if (menu) menu.hidden = true;
    if (k === I18N_lang) return;
    try { Store.set('er.lang2', k); } catch (e) {}
    setTimeout(function(){ location.reload(); }, 120);
  });
  const info = document.getElementById('i18nInfo');
  if (info) info.addEventListener('click', function(ev){ ev.preventDefault(); I18N_modal(); });
  if (!window.__i18nDocBound){
    window.__i18nDocBound = true;
    document.addEventListener('click', function(ev){
      const m = document.getElementById('i18nMenu');
      if (!m) return;
      const w = document.getElementById('i18nSw');
      if (w && ev.target && w.contains && w.contains(ev.target)) return;
      m.hidden = true;
      const b = document.getElementById('i18nBtn');
      if (b) b.setAttribute('aria-expanded', 'false');
    });
  }
}

function I18N_coverage(){
  const total = Object.keys(I18N_SEEN).length;
  const miss = Object.keys(I18N_MISS).length;
  return { en:{ done:Object.keys(I18N_EN).length, total:total, rate:(total ? 100 * (total - miss) / total : 0) },
           zh:{ done:Object.keys(I18N_ZH).length, total:total, rate:(total ? 100 * (total - miss) / total : 0) } };
}

function I18N_keyChip(){

  const el = document.createElement('button');
  el.id = 'cmcKeyChip'; el.type = 'button'; el.className = 'chip f'; el.textContent = 'CMC …';

function I18N_keyChip_fill(){
  const el = document.getElementById('cmcKeyChip');
  if (!el) return;
  fetch(API.base + '/api/health', { cache:'no-store' }).then(r => r.json()).catch(() => null).then(d => {
    if (!d){ el.textContent = 'CMC ✕'; el.title = t('Không kết nối được máy chủ.'); return; }
    const raw = d.plan || {};
    const pl = (raw.data && raw.data.plan) ? raw.data.plan : raw;
    const us = (raw.data && raw.data.usage) ? raw.data.usage : (raw.usage || {});
    const p = pl.credit_limit_monthly || null;
    const left = us.current_month ? us.current_month.credits_left : null;
    if (d.keyProvided && d.keyValid){
      el.textContent = 'CMC ✓';
      el.title = 'Key: ' + (d.keySource || '?') + (p ? ' · ' + I18N_num(p, 0) + ' credit/tháng' : '') +
        (left != null ? ' · còn ' + I18N_num(left, 0) : '');
    } else {
      el.textContent = 'CMC ✕';
      el.title = t('chưa có key') + (d.keyError ? ' · ' + d.keyError : '');
      el.title = (d.keyError || '') + '';
    }
  });
}
